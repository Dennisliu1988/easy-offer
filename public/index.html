<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>前端面试刷题器</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --brand:#2563eb; --brand-soft:#eff6ff;
    --ok:#16a34a; --ok-soft:#ecfdf5; --bad:#dc2626; --bad-soft:#fef2f2;
    --warn:#d97706; --warn-soft:#fffbeb; --wrong:#7c3aed; --wrong-soft:#f5f3ff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;
    align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
  header h1{font-size:18px;margin:0;font-weight:700}
  nav{display:flex;gap:6px;flex-wrap:wrap}
  nav button{background:transparent;border:1px solid var(--line);color:var(--muted);
    padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
  nav button.active{background:var(--brand);border-color:var(--brand);color:#fff}
  nav button:hover{border-color:var(--brand);color:var(--brand)}
  .wrap{max-width:920px;margin:0 auto;padding:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
  .btn{display:inline-block;border:none;border-radius:10px;padding:10px 18px;font-size:15px;cursor:pointer;
    background:var(--brand);color:#fff;font-weight:600}
  .btn:hover{filter:brightness(1.05)}
  .btn.ghost{background:var(--brand-soft);color:var(--brand)}
  .btn.soft{background:#f3f4f6;color:var(--ink)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
  .stat{background:var(--brand-soft);border-radius:12px;padding:12px 16px;min-width:110px}
  .stat b{display:block;font-size:24px;color:var(--brand)}
  .stat span{font-size:12px;color:var(--muted)}
  .q{counter-increment:q;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-bottom:14px}
  .badges{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .badge.t-single{background:var(--brand-soft);color:var(--brand);border-color:#bfdbfe}
  .badge.t-multiple{background:var(--warn-soft);color:var(--warn);border-color:#fde68a}
  .badge.t-boolean{background:var(--wrong-soft);color:var(--wrong);border-color:#ddd6fe}
  .badge.cat{background:#f1f5f9;color:#475569}
  .q .stem{font-weight:600;margin-bottom:10px}
  .q .stem::before{content:counter(q) ". ";color:var(--brand)}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1px solid var(--line);
    border-radius:10px;margin-bottom:8px;cursor:pointer}
  .opt:hover{background:#f9fafb}
  .opt input{margin-top:5px}
  .opt.correct{background:var(--ok-soft);border-color:#bbf7d0}
  .opt.wrong{background:var(--bad-soft);border-color:#fecaca}
  .explain{margin-top:10px;padding:10px 12px;background:#f8fafc;border-left:3px solid var(--brand);
    border-radius:6px;font-size:13px;color:#334155;white-space:pre-wrap}
  .yourans{font-size:13px;margin-top:6px}
  .yourans .yk{color:var(--bad);font-weight:600}
  .score-big{font-size:46px;font-weight:800;color:var(--brand)}
  .list-item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;
    border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
  .list-item:hover{background:#f9fafb}
  .list-item .meta{font-size:12px;color:var(--muted)}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px}
  .pill.normal{background:var(--brand-soft);color:var(--brand)}
  .pill.wrongbook{background:var(--wrong-soft);color:var(--wrong)}
  .muted{color:var(--muted)}
  .loading{text-align:center;padding:40px;color:var(--muted)}
  .spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);
    border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#111827;color:#fff;
    padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;z-index:50;max-width:80%}
  .toast.show{opacity:.95}
  label.fld{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input[type=text],input[type=password],select{width:100%;padding:9px 11px;border:1px solid var(--line);
    border-radius:9px;font-size:14px;background:#fff}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .progress{font-size:13px;color:var(--muted);margin-bottom:12px}
  .cat-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .cat-grid .c{font-size:12px;padding:6px 10px;border-radius:8px;background:#f1f5f9;color:#475569}
  details.card{ cursor:default }
  details.card > summary{ list-style:none; padding:4px 2px; outline:none; user-select:none }
  details.card > summary::-webkit-details-marker{ display:none }
</style>
</head>
<body>
<header>
  <h1>前端面试刷题器 🦉</h1>
  <nav id="nav">
    <button data-view="sim" class="active">面试模拟</button>
    <button data-view="bank">题库</button>
    <button data-view="wrong">错题本</button>
    <button data-view="settings">设置/AI</button>
  </nav>
</header>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* 全局错误兜底：避免白屏，把错误显示到页面上 */
window.addEventListener('error', function(e){
  var d=document.getElementById('app');
  if(d){
    d.innerHTML = '<div class="card" style="border-color:#fecaca">'
      + '<h3 style="margin-top:0;color:#dc2626">⚠️ 页面运行出错</h3>'
      + '<pre style="white-space:pre-wrap;font-size:13px;color:#334155;margin:0">'
      + String(e.message||(e.error&&e.error.message)||'未知错误')
      + '\n\n位置：'+(e.filename||'')+':'+(e.lineno||'')
      + '</pre>'
      + '<p class="muted" style="margin-top:10px">若提示 CORS / 网络 / fetch 相关错误，多半是双击(file://)打开导致的跨域限制。请在该文件所在目录运行 <code>node server.js</code>，再访问 <code>http://localhost:8080/</code>。</p>'
      + '</div>';
  }
});

/* ============ 本地存储 ============ */
const LS = { bank:'feiq_bank', rounds:'feiq_rounds', wrong:'feiq_wrong', settings:'feiq_settings', proxyKey:'feiq_proxy_key' };
const TYPES = ['single','multiple','boolean'];
const CATS = ['JS','Vue2','Vue3','HTML','CSS','封装','优化'];

function loadLS(key, def){ try{ return JSON.parse(localStorage.getItem(key)) ?? def; }catch(e){ return def; } }

/* ============ 数据层：内存 DB + 自动同步 ============
 * 优先连接本地 Node 服务(/api/data)，自动把数据落盘到同目录 data.json；
 * 若未启动服务(直接双击 file:// 打开)，则回退到浏览器 localStorage，并仍可手动导出。
 * 这样无论哪种打开方式都不会崩，且启动服务后数据真正持久化到实体文件。 */
const DB = { feiq_bank:[], feiq_rounds:[], feiq_wrong:{}, feiq_settings:{}, feiq_proxyKey:'' };
let USE_SERVER = false;
let _syncTimer = null;

async function bootstrap(){
  try{
    const r = await fetch('/api/data', { cache:'no-store' });
    if (r.ok){
      const d = await r.json();
      DB[LS.bank] = Array.isArray(d.bank) ? d.bank : [];
      DB[LS.rounds] = Array.isArray(d.rounds) ? d.rounds : [];
      DB[LS.wrong] = (d.wrong && typeof d.wrong==='object') ? d.wrong : {};
      DB[LS.settings] = (d.settings && typeof d.settings==='object') ? d.settings : {};
      DB[LS.proxyKey] = typeof d.proxyKey==='string' ? d.proxyKey : '';
      USE_SERVER = true;
      // 同时镜像到 localStorage，作为离线/二次备份
      try{ localStorage.setItem(LS.bank, JSON.stringify(DB[LS.bank])); localStorage.setItem(LS.rounds, JSON.stringify(DB[LS.rounds])); localStorage.setItem(LS.wrong, JSON.stringify(DB[LS.wrong])); localStorage.setItem(LS.settings, JSON.stringify(DB[LS.settings])); localStorage.setItem(LS.proxyKey, DB[LS.proxyKey]); }catch(e){}
      return;
    }
  }catch(e){ /* 未启动服务，走回退分支 */ }
  DB[LS.bank] = loadLS(LS.bank, []);
  DB[LS.rounds] = loadLS(LS.rounds, []);
  DB[LS.wrong] = loadLS(LS.wrong, {});
  DB[LS.settings] = loadLS(LS.settings, {});
  DB[LS.proxyKey] = loadLS(LS.proxyKey, '');
  USE_SERVER = false;
}

function load(key, def){ const v = DB[key]; return (v===undefined || v===null) ? def : v; }
function scheduleSync(){
  if (_syncTimer) clearTimeout(_syncTimer);
  _syncTimer = setTimeout(doSync, 250);
}
async function doSync(){
  if (USE_SERVER){
    try{
      await fetch('/api/data', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ bank:DB[LS.bank], rounds:DB[LS.rounds], wrong:DB[LS.wrong], settings:DB[LS.settings], proxyKey:DB[LS.proxyKey] }) });
    }catch(e){ console.warn('同步到后端失败（数据仍在内存，下次变更会重试）：', e); }
  } else {
    try{ localStorage.setItem(LS.bank, JSON.stringify(DB[LS.bank])); localStorage.setItem(LS.rounds, JSON.stringify(DB[LS.rounds])); localStorage.setItem(LS.wrong, JSON.stringify(DB[LS.wrong])); localStorage.setItem(LS.settings, JSON.stringify(DB[LS.settings])); localStorage.setItem(LS.proxyKey, DB[LS.proxyKey]); }catch(e){}
  }
}
function save(key, val){ DB[key] = val; scheduleSync(); }
function getBank(){ return load(LS.bank, []); }
function saveBank(b){ save(LS.bank, b); }
function getRounds(){ return load(LS.rounds, []); }
function getWrong(){ return load(LS.wrong, {}); }
function getSettings(){
  const s = load(LS.settings, {}) || {};
  const provider = normalizeProvider(s.provider);           // 旧版 provider='proxy' 自动迁移
  const apiKeys = Object.assign({}, (s.apiKeys && typeof s.apiKeys === 'object') ? s.apiKeys : {});
  if (s.apiKey && !apiKeys[provider]) apiKeys[provider] = s.apiKey;  // 兼容旧版单一 apiKey 字段
  return Object.assign({ provider:'local', model:'', apiKey:'', baseUrl:'' }, s, { provider, apiKeys });
}

/* ============ 内置兜底题库（首次运行注入，之后由 AI 不断充盈） ============ */
const BUILTIN = [

  {type:'single',category:'JS',question:'以下哪个数组方法会返回一个新数组？',options:['push','splice','map','sort'],answer:2,explanation:'map/filter 等返回新数组；push/splice/sort 会修改原数组。'},

  {type:'single',category:'JS',question:'非严格模式下，普通函数独立调用时 this 指向？',options:['调用者','window（非严格）','undefined','函数自身'],answer:1,explanation:'非严格模式普通调用 this 指向全局对象 window；严格模式为 undefined。'},
  {type:'single',category:'JS',question:'let a=1; function f(){ console.log(a); let a=2; } f(); 会？',options:['输出 1','输出 2','报错（暂时性死区）','输出 undefined'],answer:2,explanation:'函数内 let a 形成块级作用域并存在 TDZ，访问早于声明会报错。'},

  {type:'single',category:'JS',question:'Array.isArray([]) 的结果是？',options:['true','false','undefined','报错'],answer:0,explanation:'Array.isArray 用于判断是否为数组，返回 true。'},

  {type:'single',category:'HTML',question:'下列属于 HTML5 语义化标签的是？',options:['<header> <article> <section>','<div>','<span>','<table>'],answer:0,explanation:'header/article/section/nav/footer 等是 HTML5 新增的语义化标签。'},

/* ============ 工具函数 ============ */
function hashQid(type, q){
  const s = type + '|' + q.trim();
  let h = 5381;
  for (let i=0;i<s.length;i++){ h = ((h<<5) + h + s.charCodeAt(i)) | 0; }
  return 'q' + (h >>> 0).toString(36);
}
function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pad(n){ return String(n).padStart(2,'0'); }
function stamp14(d){ d = d||new Date(); return ''+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds()); }
function fmtTime(ts){ const d=new Date(ts); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============ 题库：去重注入 ============ */
/* 内置题库：每次启动都把缺失的内置题补进题库（去重），保证离线也能凑满一轮 */
function seedBankIfEmpty(){
  const bank = getBank();
  const set = new Set(bank.map(b=>b.qid));
  let added = 0;
  for (const q of BUILTIN){
    const qid = hashQid(q.type, q.question);
    if (set.has(qid)) continue;
    set.add(qid);
    bank.push(Object.assign({ qid, createdAt: Date.now(), builtin:true }, q));
    added++;
  }
  if (added > 0) saveBank(bank);
  return added;
}
function addToBank(questions){
  const bank = getBank();
  const set = new Set(bank.map(b=>b.qid));
  const added = [];
  for (const q of questions){
    const qid = hashQid(q.type, q.question);
    if (set.has(qid)){ continue; }
    set.add(qid);
    const item = Object.assign({ qid, createdAt: Date.now() }, q);
    bank.push(item); added.push(item);
  }
  if (added.length) saveBank(bank);
  return added.length;
}
function getFromBank(qid){ return getBank().find(b=>b.qid===qid) || null; }

function normalizeProvider(p){ return (p && PROVIDER_PRESETS[p]) ? p : 'local'; }
function modelsOf(preset){ return preset.models || []; }
function pickContent(data){
  if (!data) return '';
  const msg = data.choices && data.choices[0] && data.choices[0].message;
  if (msg){
    const c = msg.content;
    if (typeof c === 'string' && c.trim()) return c;
    if (Array.isArray(c)){
      const joined = c.map(p => (typeof p === 'string' ? p : (p && p.text) || '')).join('');
      if (joined.trim()) return joined;
    }
    if (c && typeof c === 'object' && c.text) return c.text;
    // 有些模型（如 gpt-oss 系列）把内容写进 reasoning 字段
    if (typeof msg.reasoning === 'string' && msg.reasoning.trim()) return msg.reasoning;
  }
  return typeof data.content === 'string' ? data.content : '';
}

function resolveAIConfig(s){
  const provider = normalizeProvider(s.provider);
  const preset = PROVIDER_PRESETS[provider];
  if (preset.local) throw new Error('当前为「本地题库出题」模式，不需要调用 AI。想用 AI 出题请在「设置/AI」里选智谱 GLM 等接口并填 Key。');
  // 若设置里残留了别的服务商的模型名，自动回落到当前服务商的默认模型
  let model = (s.model || '').trim();
  if (s.provider !== 'custom' && modelsOf(preset).length && modelsOf(preset).indexOf(model) < 0) model = preset.model;
  model = model || preset.model;
  const isCustom = provider === 'custom';
  const chatUrl = isCustom ? (s.baseUrl || '').trim() : preset.chatUrl;
  const key = ((s.apiKeys || {})[provider] || s.apiKey || '').trim();
  if (!chatUrl) throw new Error('请填写自定义接口的完整地址（形如 https://xxx/v1/chat/completions）');
  if (!model) throw new Error('请选择或填写模型名');
  if (preset.needKey && !key) throw new Error('请先填写「'+preset.label.split('（')[0]+'」的 API Key'+(preset.keyUrl?'（免费获取：'+preset.keyUrl+'）':''));
  return { provider, preset, chatUrl, model, key };
}

async function callAI(messages, settingsOverride){
  const s = Object.assign({}, getSettings(), settingsOverride || {});
  // 有本地服务时，AI 调用走后端代理（同源、无 CORS，Key 仅存本机后端）
  if (USE_SERVER){
    const resp = await fetch('/api/ai', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ messages, settings: s }) });
    if (!resp.ok){
      let detail='';
      try{ const j = await resp.json(); detail = j && j.error ? j.error : JSON.stringify(j).slice(0,200); }
      catch(e){ try{ detail = (await resp.text()).slice(0,200); }catch(e2){} }
      throw new Error(detail || ('AI 接口返回 '+resp.status));
    }
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    return data.content || '';
  }

  const cfg = resolveAIConfig(s, false);
  const resp = await fetch(cfg.chatUrl, {
    method:'POST',
    headers: Object.assign({'Content-Type':'application/json'}, cfg.key?{'Authorization':'Bearer '+cfg.key}:{}),
    body: JSON.stringify({ model: cfg.model, messages, temperature:0.7, stream:false })
  });
  const text = await resp.text();
  if (!resp.ok){
    let detail = text.slice(0, 300).replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
    if (resp.status === 401 || resp.status === 403) detail = 'API Key 无效或没有权限，请到「设置/AI」检查 Key。' + detail;
    else if (resp.status === 402) detail = '该接口额度不足（免费额度用尽），建议改用智谱 glm-4-flash 或本地题库。' + detail;
    else if (resp.status === 429) detail = '请求过于频繁被限流，稍等一会儿再试，或改用智谱/本地题库。' + detail;
    else if (resp.status === 404) detail = '接口地址不对（404），请检查服务商与接口地址。' + detail;
    throw new Error('接口返回 '+resp.status+'：'+(detail || '（无内容）'));
  }
  let data;
  try{ data = JSON.parse(text); }
  catch(e){ throw new Error('接口返回的内容不是 JSON（可能是被网关拦截或模型不支持）：'+text.slice(0,120)); }
  const out = pickContent(data);
  if (!out) throw new Error('接口未返回有效内容'+(data.error ? '：'+(data.error.message||data.error) : ''));
  return out;
}

function buildPrompt(part){
  const head = `请严格按照要求生成前端面试基础练习题，只返回一个 JSON 数组（不要任何解释文字，不要 markdown 代码块）。

题目范围：仅限前端面试最基础的知识点，覆盖 JavaScript、Vue2、Vue3、HTML、CSS。
难度要求：全部为基础题。不要算法题，不要难度高或需要复杂计算的题，不要冷门偏题。
`;
  const fmt = `
每道题的对象格式：
{
  "type": "single" | "multiple" | "boolean",
  "category": "JS" | "Vue2" | "Vue3" | "HTML" | "CSS",
  "question": "题干（中文）",
  "options": ["选项A","选项B", ...],
  "answer": 数字索引 或 数字索引数组,
  "explanation": "正确答案的简明讲解（中文，1~3 句话）"
}
要求：所有文字用中文；category 在五类中尽量均衡分布；解析写得简短（不超过 2 句），确保题目数量完整不被截断；只返回一个 JSON 数组。`;
  if (part === 'single'){
    return head + `
本题组内容：恰好 40 道单选题（type 为 "single"），每题恰好 4 个选项（options 长度为 4），answer 为正确选项索引（从 0 开始）。
` + fmt;
  }
  return head + `
本题组内容：共 20 道题 = 10 道多选题（type 为 "multiple"，每题 3~4 个选项，answer 是"至少 2 个正确项索引"组成的数组） + 10 道判断题（type 为 "boolean"，options 固定为 ["正确","错误"]，answer 为 0 或 1）。
` + fmt;
}

function toIndex(a){
  if (typeof a === 'number') return a;
  if (typeof a === 'string'){
    const s = a.trim();
    if (/^[0-9]+$/.test(s)) return parseInt(s,10);
    const m = s.match(/[A-Za-z]/);
    if (m) return m[0].toUpperCase().charCodeAt(0) - 65;
  }
  return -1;
}
function normalizeQuestion(r){
  const type = (r && r.type || '').toLowerCase();
  if (TYPES.indexOf(type) < 0) return null;
  let options = Array.isArray(r.options) ? r.options.map(String) : [];
  if (type === 'boolean') options = ['正确','错误'];
  if (options.length < 2) return null;
  let answer;
  if (type === 'multiple'){
    let arr = Array.isArray(r.answer) ? r.answer : [r.answer];
    answer = arr.map(toIndex).filter(i=>i>=0 && i<options.length);
    if (answer.length < 1) return null;
    answer = Array.from(new Set(answer)).sort((a,b)=>a-b);
  } else {
    answer = toIndex(r.answer);
    if (answer < 0 || answer >= options.length) return null;
  }
  const category = CATS.indexOf(r.category) >= 0 ? r.category : 'JS';
  const question = String(r.question || '').trim();
  if (!question) return null;
  const explanation = String(r.explanation || '（无解析）').trim();
  return { type, category, question, options, answer, explanation };
}
function parseAIQuestions(text){
  let raw = text.trim();
  // 去掉可能的 ```json ... ``` 围栏
  raw = raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');
  let arr;
  try { arr = JSON.parse(raw); }
  catch(e){
    const s = raw.indexOf('['), eIdx = raw.lastIndexOf(']');
    if (s>=0 && eIdx>s){ try{ arr = JSON.parse(raw.slice(s, eIdx+1)); }catch(e2){ arr=null; } }
  }
  if (!Array.isArray(arr)) throw new Error('AI 返回的内容无法解析为题目数组');
  const out = [];
  for (const item of arr){ const q = normalizeQuestion(item); if (q) out.push(q); }
  if (out.length === 0) throw new Error('AI 返回的题目全部不合规');
  return out;
}

// 按类型上限裁剪为 40 单选 / 10 多选 / 10 判断，防止 AI 超额返回
function normalizeRoundCounts(qs){
  const cap = { single:40, multiple:10, boolean:10 };
  const kept = { single:0, multiple:0, boolean:0 };
  const out = [];
  for (const q of qs){
    const t = q.type;
    if (kept[t] < cap[t]){ out.push(q); kept[t]++; }
  }
  return out;
}

/* 用本地题库把一轮补齐到 40 单选 / 10 多选 / 10 判断 */
function padRoundFromBank(qs){
  const cap = { single:40, multiple:10, boolean:10 };
  const cnt = { single:0, multiple:0, boolean:0 };
  for (const q of qs){ if (cnt[q.type] !== undefined) cnt[q.type]++; }
  const need = {};
  for (const t in cap) need[t] = Math.max(0, cap[t] - cnt[t]);
  if (!need.single && !need.multiple && !need.boolean) return qs;

  const used = new Set(qs.map(q=>hashQid(q.type, q.question)));
  const pool = { single:[], multiple:[], boolean:[] };
  for (const b of getBank()){
    if (pool[b.type] && !used.has(b.qid)) pool[b.type].push(b);
  }
  const out = qs.slice();
  for (const t in cap){
    if (!need[t]) continue;
    for (const b of shuffle(pool[t]).slice(0, need[t])){
      out.push({ type:b.type, category:b.category, question:b.question,
                 options:b.options.slice(), answer: Array.isArray(b.answer)?b.answer.slice():b.answer,
                 explanation:b.explanation });
    }
  }
  return out;
}

/* 分两批请求出题（40 单选 / 10 多选+10 判断），降低单次输出过长被截断的概率。
   返回 { questions, aiCount, error }，调用方据此决定提示文案。 */
async function generateAIQuestions(){
  const sys = { role:'system', content:'你是资深前端面试出题官，只出基础题，输出严格 JSON 数组。' };
  let qs = [];
  let errMsg = '';
  for (const part of ['single','many']){
    const messages = [sys, { role:'user', content: buildPrompt(part) }];
    for (let attempt = 0; attempt < 2; attempt++){
      try{
        const text = await callAI(messages);
        const got = parseAIQuestions(text);
        const seen = new Set(qs.map(q=>hashQid(q.type, q.question)));
        for (const q of got){
          const h = hashQid(q.type, q.question);
          if (!seen.has(h)){ qs.push(q); seen.add(h); }
        }
        break;                        // 本批成功
      }catch(e){
        errMsg = e.message;           // 记录最后一次错误
      }
    }
  }
  const aiCount = normalizeRoundCounts(qs).length;
  if (qs.length === 0) throw new Error(errMsg || 'AI 未返回可用题目');
  return { questions: padRoundFromBank(normalizeRoundCounts(qs)), aiCount: aiCount };
}

/* 从本地题库随机抽 n 道（按类型比例尽量接近 40/10/10） */
function sampleFromBank(n){
  const bank = getBank();
  if (bank.length === 0) return [];
  const byType = { single:[], multiple:[], boolean:[] };
  for (const q of bank){ byType[q.type].push(q); }
  const want = { single: Math.min(40, byType.single.length), multiple: Math.min(10, byType.multiple.length), boolean: Math.min(10, byType.boolean.length) };
  // 若某类不足，用其他类补齐到 n
  let picks = [];
  for (const t of ['single','multiple','boolean']) picks = picks.concat(shuffle(byType[t]).slice(0, want[t]));
  let remain = n - picks.length;
  if (remain > 0){
    const pool = shuffle(bank.filter(q=>!picks.includes(q)));
    picks = picks.concat(pool.slice(0, remain));
  }
  return shuffle(picks).map(q=>({ type:q.type, category:q.category, question:q.question, options:q.options.slice(), answer: Array.isArray(q.answer)?q.answer.slice():q.answer, explanation:q.explanation }));
}

/* ============ 判分 ============ */
function pointOf(type){ return type==='single'?1.5 : 2; } // 多选/判断均为 2
function arraysEqual(a,b){ if(!a||!b||a.length!==b.length) return false; const x=a.slice().sort(),y=b.slice().sort(); return x.every((v,i)=>v===y[i]); }
function isCorrect(q, ua){
  if (ua===null || ua===undefined) return false;
  if (q.type==='multiple'){ return arraysEqual(ua, q.answer); }
  return ua === q.answer;
}
function computeScore(questions){
  let score=0, total=0, wrong=0;
  for (const q of questions){
    const pt = pointOf(q.type); total += pt;
    const ok = isCorrect(q, q.userAnswer);
    if (ok) score += pt; else wrong++;
  }
  return { score:Math.round(score*10)/10, total:Math.round(total*10)/10, wrong, correct:questions.length-wrong };
}

/* ============ 错题本更新 ============ */
function updateWrongNormal(questions){
  const w = getWrong();
  for (const q of questions){
    if (isCorrect(q, q.userAnswer)) continue; // 常规轮只对错的入/更新错题本
    const e = w[q.qid] || { qid:q.qid, wrongCount:0, lastWrong:0, correctStreak:0 };
    e.wrongCount++; e.lastWrong = Date.now(); e.correctStreak = 0;
    w[q.qid] = e;
  }
  save(LS.wrong, w);
}
function updateWrongPractice(questions){
  const w = getWrong();
  for (const q of questions){
    const e = w[q.qid];
    if (!e) continue; // 理论上都在
    if (isCorrect(q, q.userAnswer)){
      e.correctStreak = (e.correctStreak||0) + 1;
      if (e.correctStreak >= 2){ delete w[q.qid]; } // 连续答对 2 次移出
    } else {
      e.wrongCount++; e.lastWrong = Date.now(); e.correctStreak = 0;
    }
  }
  save(LS.wrong, w);
}

/* ============ 全局状态 & 路由 ============ */
const state = { view:'sim', param:null, current:null };
const app = document.getElementById('app');

/* 用 location.hash 做路由：浏览器前进/后退可用，每个视图都进入历史记录 */
function parseHash(){
  const h = (location.hash||'').replace(/^#/,'');
  if (!h) return { view:'sim', param:null };
  const i = h.indexOf(':');
  if (i < 0) return { view:h, param:null };
  return { view:h.slice(0,i), param:h.slice(i+1) };
}
function go(view, param){
  const hash = param ? view + ':' + param : view;
  if (('#' + hash) === location.hash){ render(); }
  else { location.hash = hash; }
}
function onRoute(){
  const r = parseHash();
  const allowed = ['sim','bank','wrong','settings','exam','result'];
  state.view = allowed.indexOf(r.view) >= 0 ? r.view : 'sim';
  state.param = r.param;
  render();
}
window.addEventListener('hashchange', onRoute);

/* 正在答题时点其它按钮离开，弹出确认（作答已自动保存，可稍后继续） */
function allowLeave(){
  if (state.view === 'exam' && state.current){
    const answered = state.current.questions.some(q => q.userAnswer !== null && (q.type !== 'multiple' || (q.userAnswer && q.userAnswer.length > 0)));
    if (answered) return confirm('正在答题，确定离开当前页面吗？\n（你的作答已自动保存，可从「面试模拟」列表重新进入继续）');
  }
  return true;
}

function render(){
  document.querySelectorAll('#nav button').forEach(b=>{
    const v = b.dataset.view;
    b.classList.toggle('active', v === state.view || ((state.view==='exam'||state.view==='result') && v==='sim'));

function generateNewRound(){
  const provider = normalizeProvider(getSettings().provider);
  const round = createRound('ai');

  round.generating = true;

  renderSim();                       // 立即把这一组插到列表（显示“生成中”），无需等待
  (async ()=>{
    let qs, source = round.source, warn = null;
    try{
      if (PROVIDER_PRESETS[provider].local){ qs = sampleFromBank(60); source = '本地题库'; }
      else {
        const r = await generateAIQuestions();
        qs = r.questions; source = 'AI 出题';
        const added = addToBank(qs);
        if (added > 0) toast('新题已入库 ' + added + ' 道');
      }
    }catch(e){ qs = sampleFromBank(60); source = '本地题库（AI 失败）'; warn = e.message; }
    qs = qs.map(q=>({
      type:q.type, category:q.category, question:q.question,
      options:q.options.slice(), answer:Array.isArray(q.answer)?q.answer.slice():q.answer,
      explanation:q.explanation, qid:q.qid || hashQid(q.type, q.question), userAnswer:null
    }));
    const rounds = getRounds();
    const idx = rounds.findIndex(x=>x.roundId===round.roundId);

      const nameAttr = 'opt'+i;
      const checked = q.type==='multiple' ? (Array.isArray(q.userAnswer) && q.userAnswer.indexOf(j)>=0) : (q.userAnswer===j);
      return `<label class="opt"><input type="${inpType}" name="${nameAttr}" data-q="${i}" data-o="${j}" ${checked?'checked':''} ${q.type==='multiple'?'':'value="'+j+'"'}/> <span>${String.fromCharCode(65+j)}. ${escapeHtml(o)}</span></label>`;
    }).join('');
    return `<div class="q"><div class="badges"><span class="badge t-${q.type}">${badge}</span><span class="badge cat">${q.category}</span></div>
      <div class="stem">${escapeHtml(q.question)}</div>${opts}</div>`;
  }).join('');
  app.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div><b>${escapeHtml(round.name)}</b> ${round.kind==='wrongbook'?'<span class="pill wrongbook">错题练习</span>':''} ${round.source?`<span class="badge cat">${escapeHtml(round.source)}</span>`:''} <a href="javascript:void(0)" id="exitExam" style="margin-left:10px;font-size:13px;color:var(--brand)">← 返回列表</a></div>
        <div class="progress" id="prog">已答 0 / ${round.questions.length}</div>
      </div>
      <button class="btn" id="submitBtn">交卷</button>
    </div>
    <div id="qlist">${list}</div>
    <div class="card" style="text-align:center"><button class="btn" id="submitBtnBottom">交卷</button></div>`;
  app.querySelectorAll('input[type=radio],input[type=checkbox]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const i = +inp.dataset.q, j = +inp.dataset.o;
      const q = round.questions[i];
      if (q.type==='multiple'){
        const set = new Set(Array.isArray(q.userAnswer)?q.userAnswer:[]);
        if (inp.checked) set.add(j); else set.delete(j);
        q.userAnswer = Array.from(set).sort((a,b)=>a-b);
      } else {
        q.userAnswer = j;
        app.querySelectorAll(`input[name="opt${i}"]`).forEach(o=>{ if (+o.dataset.o !== j) o.checked = false; });
      }
      persistRounds();           // 作答实时落盘，离开后可继续
      updateProgress();
    });
  });
  document.getElementById('submitBtn').onclick = submitExam;
  document.getElementById('submitBtnBottom').onclick = submitExam;
  const ex = document.getElementById('exitExam'); if (ex) ex.onclick = ()=>{ if(!allowLeave()) return; go('sim'); };
  updateProgress();
}
function updateProgress(){
  const cur = state.current; if(!cur) return;
  const n = cur.questions.filter(q=>q.userAnswer!==null && (q.type!=='multiple' || (q.userAnswer&&q.userAnswer.length>0))).length;
  const p = document.getElementById('prog'); if(p) p.textContent = '已答 '+n+' / '+cur.questions.length;
}

function submitExam(){
  const round = state.current;
  if (!round) return;
  const sc = computeScore(round.questions);
  round.status = 'done';
  round.score = sc.score; round.total = sc.total; round.wrong = sc.wrong; round.correct = sc.correct;
  persistRounds();
  if (round.kind === 'wrongbook') updateWrongPractice(round.questions); else updateWrongNormal(round.questions);
  state.current = null;
  go('result', round.roundId);
}

function renderResult(roundId){
  const round = getRound(roundId);
  if (!round){ app.innerHTML = '<div class="card muted">未找到该组。</div>'; return; }
  const pct = round.total>0 ? Math.round(round.score/round.total*100) : 0;
  const items = round.questions.map(q=>{
    const badge = q.type==='single'?'单选':q.type==='multiple'?'多选':'判断';
    const ok = isCorrect(q, q.userAnswer);
    const opts = q.options.map((o,j)=>{
      const isAns = Array.isArray(q.answer)? q.answer.indexOf(j)>=0 : q.answer===j;
      const isUser = Array.isArray(q.userAnswer)? q.userAnswer.indexOf(j)>=0 : q.userAnswer===j;
      let cls = '';
      if (isAns) cls='correct';
      else if (isUser) cls='wrong';
      return `<div class="opt ${cls}"><span>${String.fromCharCode(65+j)}. ${escapeHtml(o)}</span>${isAns?' <b style="color:var(--ok)">✓正确答案</b>':''}${isUser&&!isAns?' <b style="color:var(--bad)">✗你的选择</b>':''}</div>`;
    }).join('');
    const uaText = q.type==='multiple'
      ? (q.userAnswer&&q.userAnswer.length? q.userAnswer.map(k=>String.fromCharCode(65+k)).join('、') : '未作答')
      : (q.userAnswer!==null&&q.userAnswer!==undefined? String.fromCharCode(65+q.userAnswer) : '未作答');
    return `<div class="q"><div class="badges"><span class="badge t-${q.type}">${badge}</span><span class="badge cat">${q.category}</span>${ok?'<span class="pill normal">答对</span>':'<span class="pill wrongbook">答错</span>'}</div>
      <div class="stem">${escapeHtml(q.question)}</div>${opts}
      <div class="yourans">你的答案：<span class="${ok?'':''}">${uaText}</span>　正确答案：${Array.isArray(q.answer)? q.answer.map(k=>String.fromCharCode(65+k)).join('、') : String.fromCharCode(65+q.answer)}</div>
      <div class="explain">讲解：${escapeHtml(q.explanation)}</div></div>`;
  }).join('');
  app.innerHTML = `
    <div class="card" style="text-align:center">
      <div class="score-big">${round.score} <span style="font-size:18px;color:var(--muted)">/ ${round.total}</span></div>
      <div class="muted">正确 ${round.correct} · 错误 ${round.wrong} · 得分率 ${pct}%${round.kind==='wrongbook'?' · 错题练习':''}</div>
      <div class="row" style="justify-content:center;margin-top:14px">
        <button class="btn" id="retry">重新答题</button>
        <button class="btn ghost" id="toWrong">去看错题本</button>
        <button class="btn soft" id="backList">返回列表</button>
      </div>
    </div>
    <div id="qlist">${items}</div>`;
  document.getElementById('retry').onclick = ()=> retryRound(round.roundId);
  document.getElementById('toWrong').onclick = ()=> go('wrong');
  document.getElementById('backList').onclick = ()=> go('sim');
}
function retryRound(roundId){
  const rounds = getRounds();
  const r = rounds.find(x=>x.roundId===roundId);
  if (!r) return;
  r.questions.forEach(q=>{ q.userAnswer = null; });
  r.status = 'pending'; r.score=null; r.total=null; r.wrong=null; r.correct=null;
  persistRounds();
  go('exam', roundId);
}

/* 历史轮次已合并进「面试模拟」列表（见 renderSim），不再单独成页 */

function renderBank(){
  const bank = getBank();
  const groups = {};
  for (const q of bank){ (groups[q.category] = groups[q.category] || []).push(q); }
  const cats = Object.keys(groups).sort();
  const secs = cats.map(cat=>{
    const qs = groups[cat];
    const items = qs.map(q=>{
      const badge = q.type==='single'?'单选':q.type==='multiple'?'多选':'判断';
      const opts = q.options.map((o,j)=>{
        const isAns = Array.isArray(q.answer)? q.answer.indexOf(j)>=0 : q.answer===j;
        return `<div class="opt ${isAns?'correct':''}"><span>${String.fromCharCode(65+j)}. ${escapeHtml(o)}</span>${isAns?' <b style="color:var(--ok)">✓正确答案</b>':''}</div>`;
      }).join('');
      const ansText = Array.isArray(q.answer)? q.answer.map(k=>String.fromCharCode(65+k)).join('、') : String.fromCharCode(65+q.answer);
      return `<div class="q"><div class="badges"><span class="badge t-${q.type}">${badge}</span></div>
        <div class="stem">${escapeHtml(q.question)}</div>${opts}
        <div class="explain">答案：${ansText}　｜　${escapeHtml(q.explanation)}</div></div>`;
    }).join('');
    return `<details class="card" style="margin-bottom:12px"><summary style="cursor:pointer;font-weight:600;outline:none">${escapeHtml(cat)}（${qs.length} 题）<span class="muted" style="font-weight:400;font-size:12px">　点击展开</span></summary><div style="margin-top:12px">${items}</div></details>`;
  }).join('');
  app.innerHTML = `<div class="card">
    <h3 style="margin-top:0">本地题库</h3>
    <p class="muted">共 <b>${bank.length}</b> 题。按分类分组，默认折叠，点击分类标题展开；每题都带正确答案与解析。每次 AI 出题都会自动充实这里。</p>
    <div class="row" style="margin-top:14px"><button class="btn soft" id="bankRound2">从题库随机抽一组（离线可用）</button></div>
    <div style="margin-top:14px">${secs}</div>
  </div>`;
  const b = document.getElementById('bankRound2'); if (b) b.onclick = createBankRound;
}

  const items = ids.map(id=>{
    const e = w[id]; const q = getFromBank(id);

      <div class="meta">${t} · ${cat} · 错 ${e.wrongCount} 次 · 最近 ${fmtTime(e.lastWrong)} · 连续答对 ${e.correctStreak||0}/2</div></div>
      <span class="pill wrongbook">待巩固</span></div>`;

function renderSettings(){
  const s = getSettings();
  const provider = normalizeProvider(s.provider);
  const preset = PROVIDER_PRESETS[provider];
  const isLocal = !!preset.local;
  const models = preset.models || [];
  const curModel = (s.model || '').trim() || preset.model || '';
  const needKey = !!preset.needKey;
  const isCustomModel = models.length === 0 || models.indexOf(curModel) < 0;
  const savedKey = (s.apiKeys && s.apiKeys[provider]) || s.apiKey || '';

  const providerOpts = Object.keys(PROVIDER_PRESETS)
    .map(k => `<option value="${k}"${provider===k?' selected':''}>${escapeHtml(PROVIDER_PRESETS[k].label)}</option>`).join('');

    ${isLocal ? `
    <label class="fld">② 本地题库</label>
    <div class="hint">当前题库共 <b>${getBank().length}</b> 道（单选 ${getBank().filter(q=>q.type==='single').length} / 多选 ${getBank().filter(q=>q.type==='multiple').length} / 判断 ${getBank().filter(q=>q.type==='boolean').length}）。
    每轮从中随机抽 40 单选 + 10 多选 + 10 判断，不重复。题库会随着你使用 AI 出题不断变厚。</div>` : `

      toast('连接成功');
    }catch(e){
      hint.textContent = '❌ 连接失败：' + e.message;
      toast('连接失败');
    }
  };
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function withLoading(fn, text){
  const prev = app.innerHTML;
  app.innerHTML = `<div class="loading"><div class="spinner"></div>${text || '处理中，请稍候…'}</div>`;
  try { await fn(); }
  catch(e){ app.innerHTML = prev; toast('出错了：'+e.message); }
}

/* ============ 初始化 ============ */
function cleanWrong(){
  const w = getWrong(); const keys = Object.keys(w); let changed = false;
  for (const k of keys){ if (!k || k==='undefined' || !getFromBank(k)){ delete w[k]; changed = true; } }
  if (changed) save(LS.wrong, w);
}
/* 兼容旧版数据：给老轮次补 kind / status / createdAt 等字段 */
function migrateRounds(){
  const rounds = getRounds(); let changed = false;
  for (const r of rounds){
    if (r.kind === undefined){ r.kind = (r.type === 'wrongbook') ? 'wrongbook' : 'ai'; changed = true; }
    if (r.status === undefined){ r.status = (r.score != null) ? 'done' : 'pending'; changed = true; }
    if (r.createdAt === undefined){ r.createdAt = r.time || Date.now(); changed = true; }
    if (r.generating === undefined){ r.generating = false; changed = true; }
    if (r.source === undefined){ r.source = ''; changed = true; }
  }
  if (changed) persistRounds();
}
/* 从历史已交卷轮次重建错题本（修复早期 AI 题无 qid 导致错题本塌缩成一个条目；只跑一次） */
function rebuildWrongFromRounds(){
  const w = getWrong(); const rounds = getRounds(); let added = 0;
  for (const r of rounds){
    const done = (r.status === 'done') || (r.score != null);
    if (!done) continue;
    for (const q of (r.questions || [])){
      const bad = (typeof q.isCorrect === 'boolean') ? !q.isCorrect : !isCorrect(q, q.userAnswer);
      if (!bad) continue;
      const qid = (q.qid && q.qid !== 'undefined') ? q.qid : hashQid(q.type, q.question);
      if (!getFromBank(qid)) continue;               // 只收能在题库中解析到的题
      const e = w[qid] || { qid, wrongCount:0, lastWrong:0, correctStreak:0 };
      e.wrongCount += 1; e.lastWrong = Math.max(e.lastWrong || 0, r.time || r.createdAt || 0); e.correctStreak = 0;
      w[qid] = e; added++;
    }
  }
  if (added) save(LS.wrong, w);
  return added;
}
async function init(){
  document.querySelectorAll('#nav button').forEach(b=> b.onclick = ()=>{ if(!allowLeave()) return; go(b.dataset.view); });
  await bootstrap();
  seedBankIfEmpty();
  migrateRounds();
  cleanWrong();
  const stored = load(LS.settings, {}) || {};
  if (!stored._migratedWrong){ rebuildWrongFromRounds(); stored._migratedWrong = true; save(LS.settings, stored); }
  await doSync(); // 初始化（种子注入/恢复历史）后立即强制落盘一次，避免依赖防抖定时器导致初始数据丢失
  onRoute();      // 根据当前 hash 渲染（无 hash 时默认进入「面试模拟」）
}
init().catch(e=>{ console.error(e); var d=document.getElementById('app'); if(d){ d.innerHTML='<div class="card" style="border-color:#fecaca"><h3 style="margin-top:0;color:#dc2626">初始化失败</h3><pre style="white-space:pre-wrap;font-size:13px">'+String((e&&e.message)||e)+'</pre></div>'; } });
</script>
