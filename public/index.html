<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EasyOffer | Next-Gen Technical Interview & Practice Arena</title>
<!-- EasyOffer 专属矢量 Favicon (E + Offer Checkmark) -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><defs><linearGradient id=%22eo%22 x1=%220%25%22 y1=%220%25%22 x2=%22100%25%22 y2=%22100%25%22><stop offset=%220%25%22 stop-color=%22%234f46e5%22/><stop offset=%2250%25%22 stop-color=%22%2306b6d4%22/><stop offset=%22100%25%22 stop-color=%22%2310b981%22/></linearGradient></defs><rect width=%22100%22 height=%22100%22 rx=%2226%22 fill=%22url(%23eo)%22/><path d=%22M24 36 L50 36 M24 50 L42 50 M24 64 L50 64%22 stroke=%22%23ffffff%22 stroke-width=%228%22 stroke-linecap=%22round%22/><path d=%22M46 54 L60 68 L82 32%22 stroke=%22%23ffffff%22 stroke-width=%228%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 fill=%22none%22/></svg>">
<style>
  /* ================= 变量与主题定义 ================= */
  :root[data-theme="dark"] {
    --bg-base: #090a0f;
    --bg-surface: #12141c;
    --bg-surface-elevated: #181b26;
    --bg-hover: #1e2230;
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --brand: #6366f1;
    --brand-hover: #4f46e5;
    --brand-glow: rgba(99, 102, 241, 0.28);
    --brand-soft: rgba(99, 102, 241, 0.14);
    --brand-gradient: linear-gradient(135deg, #4f46e5 0%, #06b6d4 50%, #10b981 100%);
    --ok: #10b981;
    --ok-glow: rgba(16, 185, 129, 0.25);
    --ok-soft: rgba(16, 185, 129, 0.14);
    --bad: #f43f5e;
    --bad-glow: rgba(244, 63, 94, 0.25);
    --bad-soft: rgba(244, 63, 94, 0.14);
    --warn: #f59e0b;
    --warn-soft: rgba(245, 158, 11, 0.14);
    --purple: #a855f7;
    --purple-soft: rgba(168, 85, 247, 0.14);
    --card-shadow: 0 8px 32px -4px rgba(0, 0, 0, 0.45);
    --sidebar-bg: rgba(14, 16, 23, 0.95);
    --header-bg: rgba(18, 20, 28, 0.88);
  }

  :root[data-theme="light"] {
    --bg-base: #f8fafc;
    --bg-surface: #ffffff;
    --bg-surface-elevated: #f1f5f9;
    --bg-hover: #e2e8f0;
    --border-subtle: rgba(0, 0, 0, 0.08);
    --border-strong: rgba(0, 0, 0, 0.16);
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --brand: #4f46e5;
    --brand-hover: #4338ca;
    --brand-glow: rgba(79, 70, 229, 0.2);
    --brand-soft: rgba(79, 70, 229, 0.08);
    --brand-gradient: linear-gradient(135deg, #4f46e5 0%, #0284c7 50%, #059669 100%);
    --ok: #059669;
    --ok-glow: rgba(5, 150, 105, 0.2);
    --ok-soft: rgba(5, 150, 105, 0.08);
    --bad: #e11d48;
    --bad-glow: rgba(225, 29, 72, 0.2);
    --bad-soft: rgba(225, 29, 72, 0.08);
    --warn: #d97706;
    --warn-soft: rgba(217, 119, 6, 0.08);
    --purple: #9333ea;
    --purple-soft: rgba(147, 51, 234, 0.08);
    --card-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.06);
    --sidebar-bg: #ffffff;
    --header-bg: rgba(255, 255, 255, 0.92);
  }

  :root {
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sidebar-w: 240px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-base);
    color: var(--text-primary);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background 0.25s ease, color 0.25s ease;
  }

  /* 顶部导航 */
  header {
    background: var(--header-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border-subtle);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
    transition: background 0.25s ease, border-color 0.25s ease;
  }
  .brand-group {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }
  .brand-logo-svg {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    box-shadow: 0 0 20px var(--brand-glow);
    display: block;
    flex-shrink: 0;
  }
  .brand-text h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 800;
    letter-spacing: -0.03em;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-primary);
  }
  .brand-text .sub {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 400;
  }

  nav {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  nav button {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    padding: 7px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  nav button:hover {
    color: var(--text-primary);
    background: var(--bg-hover);
  }
  nav button.active {
    background: var(--bg-surface-elevated);
    border-color: var(--border-strong);
    color: var(--text-primary);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .action-btn {
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .action-btn:hover {
    color: var(--text-primary);
    border-color: var(--border-strong);
    background: var(--bg-hover);
  }

  /* 主体左右布局 */
  .app-container {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  /* 左侧边栏 - 岗位角色 */
  aside.sidebar {
    width: var(--sidebar-w);
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border-subtle);
    padding: 16px 14px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    transition: background 0.25s ease, border-color 0.25s ease;
  }
  .sidebar-section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    font-weight: 700;
    padding: 0 8px 4px;
  }
  .role-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .role-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    border: 1px solid transparent;
    transition: all 0.2s ease;
  }
  .role-item:hover {
    color: var(--text-primary);
    background: var(--bg-hover);
  }
  .role-item.active {
    background: var(--brand-soft);
    border-color: rgba(99, 102, 241, 0.35);
    color: var(--brand);
    font-weight: 600;
  }
  .role-label {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .role-tag {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
  }
  .role-tag.active {
    background: var(--ok-soft);
    color: var(--ok);
  }
  .role-tag.dev {
    background: var(--warn-soft);
    color: var(--warn);
  }

  /* 主工作区 */
  main.main-content {
    flex: 1;
    max-width: 980px;
    margin: 0 auto;
    padding: 16px 20px;
    width: 100%;
  }

  /* 卡片 */
  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    margin-bottom: 14px;
    box-shadow: var(--card-shadow);
    transition: border-color 0.2s ease, background 0.25s ease;
  }
  .card:hover {
    border-color: var(--border-strong);
  }

  /* 按钮体系 */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: none;
    border-radius: var(--radius-sm);
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: var(--brand);
    color: #fff;
    transition: all 0.2s ease;
    box-shadow: 0 4px 14px var(--brand-glow);
    text-decoration: none;
  }
  .btn:hover {
    background: var(--brand-hover);
    transform: translateY(-1px);
    box-shadow: 0 6px 20px var(--brand-glow);
  }
  .btn.ghost {
    background: var(--brand-soft);
    color: var(--brand);
    box-shadow: none;
    border: 1px solid rgba(99, 102, 241, 0.2);
  }
  .btn.ghost:hover {
    background: rgba(99, 102, 241, 0.22);
  }
  .btn.soft {
    background: var(--bg-surface-elevated);
    color: var(--text-primary);
    box-shadow: none;
    border: 1px solid var(--border-subtle);
  }
  .btn.soft:hover {
    background: var(--bg-hover);
    border-color: var(--border-strong);
  }
  .btn.danger {
    background: var(--bad-soft);
    color: var(--bad);
    box-shadow: none;
    border: 1px solid rgba(244, 63, 94, 0.25);
  }
  .btn.danger:hover {
    background: rgba(244, 63, 94, 0.25);
  }
  .btn.sm {
    padding: 6px 12px;
    font-size: 12px;
    border-radius: 6px;
  }
  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
  }

  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

  /* 统计面板 */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-top: 12px;
  }
  .stat-box {
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 8px 14px;
    position: relative;
    overflow: hidden;
  }
  .stat-box::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--brand-gradient);
    opacity: 0.8;
  }
  .stat-box b {
    display: block;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    font-family: var(--font-mono);
    line-height: 1.2;
  }
  .stat-box span {
    font-size: 11px;
    color: var(--text-muted);
  }

  /* 排除法组件 */
  .scope-panel {
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    margin-top: 12px;
  }
  .scope-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .scope-header h4 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .exclusion-input-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .exclusion-input-row input {
    flex: 1;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    padding: 6px 12px;
    font-size: 13px;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.2s ease;
  }
  .exclusion-input-row input:focus {
    border-color: var(--brand);
  }
  .exclusion-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .exclusion-chip {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-surface);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }
  .exclusion-chip:hover {
    border-color: var(--border-strong);
    color: var(--text-primary);
  }
  .exclusion-chip.active {
    background: var(--bad-soft);
    color: var(--bad);
    border-color: rgba(244, 63, 94, 0.4);
    font-weight: 600;
  }
  .exclusion-chip.active::before {
    content: "✕ ";
  }
  .tag-pill {
    background: var(--bad-soft);
    color: var(--bad);
    border: 1px solid rgba(244, 63, 94, 0.3);
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
  }
  .tag-pill .remove-btn {
    cursor: pointer;
    opacity: 0.7;
    font-weight: 700;
  }
  .tag-pill .remove-btn:hover { opacity: 1; }

  /* 练习组列表与分页 */
  .round-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-surface-elevated);
    border-radius: var(--radius-md);
    margin-bottom: 10px;
    transition: all 0.2s ease;
    gap: 12px;
  }
  .round-item:hover {
    border-color: var(--border-strong);
    background: var(--bg-hover);
    transform: translateX(2px);
  }
  .round-content {
    flex: 1;
    cursor: pointer;
  }
  .round-title {
    font-weight: 600;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-primary);
  }
  .round-meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .del-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    font-size: 14px;
  }
  .del-btn:hover {
    background: var(--bad-soft);
    color: var(--bad);
    border-color: rgba(244, 63, 94, 0.3);
  }

  .pagination-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border-subtle);
    font-size: 13px;
    color: var(--text-muted);
  }
  .page-btns {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .page-num {
    min-width: 30px;
    height: 30px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-subtle);
    background: var(--bg-surface-elevated);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 12px;
    font-family: var(--font-mono);
    transition: all 0.15s ease;
  }
  .page-num:hover {
    border-color: var(--border-strong);
    color: var(--text-primary);
  }
  .page-num.active {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
    font-weight: 700;
  }

  /* 试题与选项 */
  .q {
    counter-increment: q;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 18px;
    transition: border-color 0.2s ease;
  }
  .q:hover { border-color: var(--border-strong); }
  .badges {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    font-weight: 500;
  }
  .badge.t-single { background: var(--brand-soft); color: var(--brand); border-color: rgba(99, 102, 241, 0.3); }
  .badge.t-multiple { background: var(--warn-soft); color: var(--warn); border-color: rgba(245, 158, 11, 0.3); }
  .badge.t-boolean { background: var(--purple-soft); color: var(--purple); border-color: rgba(168, 85, 247, 0.3); }
  .badge.cat { background: var(--bg-surface-elevated); color: var(--text-secondary); }
  .q .stem {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    color: var(--text-primary);
    line-height: 1.6;
  }
  .q .stem::before {
    content: counter(q) ". ";
    color: var(--brand);
    font-family: var(--font-mono);
  }

  /* 代码块与行内代码 */
  .code-block-wrapper {
    margin: 12px 0 14px 0;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-subtle);
    background: var(--bg-surface-elevated);
    overflow: hidden;
    box-shadow: 0 4px 14px -2px rgba(0, 0, 0, 0.05);
    font-weight: 400;
  }
  .code-block-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 12px;
    background: var(--bg-hover);
    border-bottom: 1px solid var(--border-subtle);
    font-size: 11px;
    font-family: var(--font-mono);
  }
  .code-block-lang {
    color: var(--brand);
    font-weight: 700;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .code-block-lang::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--brand);
  }
  .code-copy-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 11px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .code-copy-btn:hover {
    color: var(--text-primary);
    background: var(--bg-surface);
  }
  .code-block-pre {
    margin: 0;
    padding: 12px 14px;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text-primary);
    background: transparent;
    tab-size: 2;
  }
  .code-block-pre code {
    font-family: inherit;
  }
  .inline-code {
    font-family: var(--font-mono);
    font-size: 0.88em;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--brand-soft);
    color: var(--brand);
    border: 1px solid rgba(99, 102, 241, 0.2);
    vertical-align: baseline;
    font-weight: 500;
  }
  .stem-text {
    line-height: 1.6;
  }
  /* 语法着色 */
  .hl-kwd { color: #818cf8; font-weight: 600; }
  .hl-str { color: #34d399; }
  .hl-num { color: #fbbf24; }
  .hl-val { color: #f472b6; font-weight: 600; }
  .hl-bi  { color: #38bdf8; }
  .hl-cmt { color: var(--text-muted); font-style: italic; }

  :root[data-theme="light"] .hl-kwd { color: #4f46e5; }
  :root[data-theme="light"] .hl-str { color: #059669; }
  :root[data-theme="light"] .hl-num { color: #d97706; }
  :root[data-theme="light"] .hl-val { color: #db2777; }
  :root[data-theme="light"] .hl-bi  { color: #0284c7; }

  /* 题型分卷横幅 (Section Divider) */
  .section-divider {
    margin: 28px 0 16px 0;
    padding: 14px 18px;
    background: var(--bg-surface-elevated);
    border-radius: var(--radius-md);
    border-left: 4px solid var(--brand);
    border-top: 1px solid var(--border-subtle);
    border-right: 1px solid var(--border-subtle);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    box-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.05);
    scroll-margin-top: 70px;
  }
  .section-divider.t-multiple {
    border-left-color: var(--warn);
  }
  .section-divider.t-boolean {
    border-left-color: var(--purple);
  }

  const c = String(rawCat || '').trim();

function t(key, params) {
  const dict = I18N[currentLang] || I18N['zh-CN'];
  let str = dict[key] || I18N['zh-CN'][key] || key;
  if (params && typeof params === 'object') {
    for (const k in params) {
      str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), params[k]);
    }
  }
  return str;
}

  document.getElementById('txtBrandTitle').textContent = t('brandTitle');

    if (k) el.textContent = t(k);
  });

  updateThemeButtonUI();
}

/* ==========================================================================
   5. 数据层与本地持久化 (纯本地轻量架构)
   ========================================================================== */
const LS = {
  bank: 'feiq_bank',
  rounds: 'feiq_rounds',
  wrong: 'feiq_wrong',
  settings: 'feiq_settings'
};

const DB = {
  feiq_bank: [],
  feiq_rounds: [],
  feiq_wrong: {},
  feiq_settings: {
    provider: 'pollinations',
    exclusions: []
  }
};

let USE_SERVER = false;
let _syncTimer = null;

function loadLS(key, def) {
  try { return JSON.parse(localStorage.getItem(key)) ?? def; }
  catch(e) { return def; }
}

async function bootstrap() {
  try {
    const r = await fetch('/api/data', { cache: 'no-store' });
    if (r.ok) {
      const d = await r.json();
      DB[LS.bank] = Array.isArray(d.bank) ? d.bank : [];
      DB[LS.rounds] = Array.isArray(d.rounds) ? d.rounds : [];
      DB[LS.wrong] = (d.wrong && typeof d.wrong === 'object') ? d.wrong : {};
      DB[LS.settings] = (d.settings && typeof d.settings === 'object') ? d.settings : {};
      USE_SERVER = true;
      try {
        localStorage.setItem(LS.bank, JSON.stringify(DB[LS.bank]));
        localStorage.setItem(LS.rounds, JSON.stringify(DB[LS.rounds]));
        localStorage.setItem(LS.wrong, JSON.stringify(DB[LS.wrong]));
        localStorage.setItem(LS.settings, JSON.stringify(DB[LS.settings]));
      } catch(e) {}
      return;
    }
  } catch(e) {}

  DB[LS.bank] = loadLS(LS.bank, []);
  DB[LS.rounds] = loadLS(LS.rounds, []);
  DB[LS.wrong] = loadLS(LS.wrong, {});
  DB[LS.settings] = loadLS(LS.settings, { provider: 'pollinations', exclusions: [] });
  USE_SERVER = false;
}

function load(key, def) {
  const v = DB[key];
  return (v === undefined || v === null) ? def : v;
}

function scheduleSync() {
  if (_syncTimer) clearTimeout(_syncTimer);
  _syncTimer = setTimeout(doSync, 200);
}

async function doSync() {
  if (USE_SERVER) {
    try {
      await fetch('/api/data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          bank: DB[LS.bank],
          rounds: DB[LS.rounds],
          wrong: DB[LS.wrong],
          settings: DB[LS.settings]
        })
      });
    } catch(e) {
      console.warn('Sync failed:', e);
    }
  } else {
    try {
      localStorage.setItem(LS.bank, JSON.stringify(DB[LS.bank]));
      localStorage.setItem(LS.rounds, JSON.stringify(DB[LS.rounds]));
      localStorage.setItem(LS.wrong, JSON.stringify(DB[LS.wrong]));
      localStorage.setItem(LS.settings, JSON.stringify(DB[LS.settings]));
    } catch(e) {}
  }
}

function save(key, val) {
  DB[key] = val;
  scheduleSync();
}

function getBank() { return load(LS.bank, []); }
function saveBank(b) { save(LS.bank, b); }
function getRounds() { return load(LS.rounds, []); }
function getWrong() { return load(LS.wrong, {}); }

function getSettings() {
  const s = load(LS.settings, {}) || {};
  const provider = normalizeProvider(s.provider || 'pollinations');
  const apiKeys = Object.assign({}, (s.apiKeys && typeof s.apiKeys === 'object') ? s.apiKeys : {});
  if (s.apiKey && !apiKeys[provider]) apiKeys[provider] = s.apiKey;
  const exclusions = Array.isArray(s.exclusions) ? s.exclusions : [];
  return Object.assign({
    provider: 'pollinations',
    model: 'openai',
    apiKey: '',
    baseUrl: '',
    exclusions: exclusions
  }, s, { provider, apiKeys, exclusions });
}

      '大数据量虚拟列表（Virtual List）可视区渲染与动态高度计算原理',
      '长任务（Long Tasks）切片处理与 requestIdleCallback / scheduler 调度'
    ]
  }
];

// 提取代码块核心特征（去除单行多行注释、空格、分号、单双引号、换行）
function extractCleanCode(text) {
  if (!text) return '';
  const codeMatches = text.match(/```(?:[a-zA-Z0-9_-]*\n)?([\s\S]*?)```/g);
  if (!codeMatches) return '';
  return codeMatches.map(m => {
    return m.replace(/```[a-zA-Z0-9_-]*\n?/g, '')
      .replace(/```/g, '')
      .replace(/\/\/[^\n]*/g, '')
      .replace(/\/\*[\s\S]*?\*\//g, '')
      .replace(/[\s;,'"``]+/g, '');
  }).join('__');
}

// 提取题干核心纯文本（去除常见八股模板套话与标点符号）
function extractCoreStem(text) {
  if (!text) return '';
  return String(text)
    .replace(/```[\s\S]*?```/g, ' ')
    .toLowerCase()
    .replace(/^(以下|下列|下面|关于|在|请问|请选出)[\s\S]{0,10}?(代码|程序|中|的|说法|表达式|选项|操作)?(输出是|输出结果是|运行结果是|结果是|正确的是|错误的是|不正确的是|描述正确的是|描述错误的是|哪个是|哪项是|不属于|属于|主要作用是|指的是)?[？?：:]*/g, '')
    .replace(/[\s\p{P}\p{S}]+/gu, '');
}

// 规范化选项集合与正确答案
function extractNormalizedOptions(opts) {
  return (opts || [])
    .map(o => String(o).trim().toLowerCase().replace(/[\s\p{P}\p{S}]+/gu, ''))
    .sort()
    .join('|');
}

// 计算多维题目特征签名（唯一指纹，用于深度去重）
function getQuestionSignature(q) {
  if (!q) return '';
  const type = q.type || 'single';
  const cleanCode = extractCleanCode(q.question);
  if (cleanCode && cleanCode.length >= 8) {
    return `${type}:::CODE:::${cleanCode}`;
  }
  const cleanStem = extractCoreStem(q.question);
  const cleanOpts = extractNormalizedOptions(q.options);
  const cleanAns = Array.isArray(q.answer) ? q.answer.slice().sort().join(',') : String(q.answer);
  if (cleanOpts && cleanOpts.length >= 6) {
    return `${type}:::OPTS:::${cleanOpts}:::ANS:::${cleanAns}:::STEM:::${cleanStem.slice(0, 10)}`;
  }
  return `${type}:::STEM:::${cleanStem || normalizeQuestionStem(q.question)}`;
}

function normalizeQuestionStem(s) {
  return String(s || '')
    .toLowerCase()
    .replace(/[\s\p{P}\p{S}]+/gu, '');
}

function hashQid(type, q) {
  const sig = getQuestionSignature({ type, question: q });
  let h = 5381;
  for (let i = 0; i < sig.length; i++) h = ((h << 5) + h + sig.charCodeAt(i)) | 0;
  return 'q' + (h >>> 0).toString(36);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pad(n) { return String(n).padStart(2, '0'); }
function stamp14(d) {
  d = d || new Date();
  return '' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
}
function fmtTime(ts) {
  if (!ts) return '近期';
  const d = new Date(ts);
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function formatCodeInQuestion(text) {
  if (!text) return '';
  if (text.includes('```')) return text;

  // 1. 检查多行代码题目：第一部分为题干提问，后续为代码行
  const lines = text.split('\n');
  if (lines.length > 1) {
    let splitIdx = -1;
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (/^(var\s+|let\s+|const\s+|function\s*[\(a-zA-Z]|console\.log|Promise\.|async\s+|class\s+|for\s*\(|if\s*\(|import\s+|export\s+|setTimeout|\/\/)/i.test(line)) {
        splitIdx = i;
        break;
      }
    }
    if (splitIdx > 0) {
      const stemPart = lines.slice(0, splitIdx).join('\n').trim();
      const codePart = lines.slice(splitIdx).join('\n').trim();
      return `${stemPart}\n\`\`\`javascript\n${codePart}\n\`\`\``;
    }
  }

  // 2. 检查单行压缩代码：例如 "let a=1; function f(){ console.log(a); let a=2; } f(); 会？"
  if (/^([a-z0-9_\s$]+=\s*|function\s+|const\s+|let\s+|var\s+).*[;{}].*(会[？\?]|输出|结果)/i.test(text.trim())) {
    const endMatch = text.match(/(会[？\?]|输出是什么[？\?]?|输出结果是[？\?]?|输出是[？\?]?|结果是[？\?]?)$/);
    if (endMatch) {
      const questionEnd = endMatch[0];
      const codePart = text.slice(0, text.length - questionEnd.length).trim();
      const formattedCode = codePart
        .replace(/;\s*(?=(let|const|var|function|console|return|f\(|foo\(|fn\())/g, ';\n')
        .replace(/\{\s*/g, '{\n  ')
        .replace(/\s*\}/g, '\n}');
      return `请问执行以下代码${questionEnd}\n\`\`\`javascript\n${formattedCode}\n\`\`\``;
    }
  }

  return text;
}

function highlightSimpleCode(raw) {
  let s = escapeHtml(raw);

  // 占位保护字符串
  const placeholders = [];
  s = s.replace(/(&quot;[\s\S]*?&quot;|&#39;[\s\S]*?&#39;|`[\s\S]*?`)/g, (m) => {
    placeholders.push(`<span class="hl-str">${m}</span>`);
    return `__HL_PH_${placeholders.length - 1}__`;
  });

  // 单行注释
  s = s.replace(/(\/\/[^\n]*)/g, (m) => {
    placeholders.push(`<span class="hl-cmt">${m}</span>`);
    return `__HL_PH_${placeholders.length - 1}__`;
  });

  // 核心关键字
  s = s.replace(/\b(const|let|var|function|return|if|else|for|while|async|await|class|new|typeof|instanceof|import|export|from|try|catch|finally|throw|switch|case|break|default|delete)\b/g, '<span class="hl-kwd">$1</span>');

  // 内置常用对象与全局函数
  s = s.replace(/\b(console|Promise|Object|Array|String|Number|Boolean|Symbol|BigInt|Map|Set|Math|JSON|window|document|setTimeout|setInterval)\b/g, '<span class="hl-bi">$1</span>');

  // 特殊常量与数字
  s = s.replace(/\b(true|false|null|undefined|NaN)\b/g, '<span class="hl-val">$1</span>');
  s = s.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="hl-num">$1</span>');

  // 还原占位符
  s = s.replace(/__HL_PH_(\d+)__/g, (_, idx) => placeholders[parseInt(idx, 10)]);

  return s;
}

function renderStem(stemText) {
  if (!stemText) return '';
  const normalized = formatCodeInQuestion(stemText);
  const parts = normalized.split(/(```[\s\S]*?```)/g);
  let html = '';

  for (const part of parts) {
    if (!part) continue;
    if (part.startsWith('```') && part.endsWith('```')) {
      const firstLineEnd = part.indexOf('\n');
      let lang = 'CODE';
      let code = '';
      if (firstLineEnd > 3) {
        lang = part.slice(3, firstLineEnd).trim() || 'JAVASCRIPT';
        code = part.slice(firstLineEnd + 1, -3);
      } else {
        code = part.slice(3, -3);
      }
      code = code.replace(/^\n+|\n+$/g, '');
      const highlighted = highlightSimpleCode(code);
      const rawSafeAttr = escapeHtml(code);
      html += `
        <div class="code-block-wrapper">
          <div class="code-block-bar">
            <span class="code-block-lang">${escapeHtml(lang.toUpperCase())}</span>
            <button class="code-copy-btn" onclick="copySnippet(this)" data-code="${rawSafeAttr}" type="button">📋 复制代码</button>
          </div>
          <pre class="code-block-pre"><code>${highlighted}</code></pre>
        </div>
      `;
    } else {
      let t = escapeHtml(part);
      t = t.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
      t = t.replace(/\n+/g, '<br/>');
      html += `<span class="stem-text">${t}</span>`;
    }
  }

  return html;
}

function renderRichText(text) {
  if (!text) return '';
  if (text.includes('```')) return renderStem(text);
  let t = escapeHtml(text);
  t = t.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
  t = t.replace(/\n+/g, '<br/>');
  return t;
}

function copySnippet(btn) {
  const code = btn.dataset.code || '';
  if (!code) return;
  navigator.clipboard.writeText(code).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML = '✓ 已复制';
    btn.style.color = 'var(--ok)';
    setTimeout(() => {
      btn.innerHTML = orig;
      btn.style.color = '';
    }, 1800);
  }).catch(() => {
    toast('复制失败，请手动选取');
  });
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = `<span style="color:var(--brand)">⚡</span> <span>${escapeHtml(msg)}</span>`;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 3000);
}

function addToBank(questions) {
  const bank = getBank();
  const setSignatures = new Set(bank.map(b => getQuestionSignature(b)));
  const setQid = new Set(bank.map(b => b.qid));
  const added = [];
  let dupCount = 0;

  for (const q of questions) {
    const sig = getQuestionSignature(q);
    const qid = hashQid(q.type, q.question);
    if (setSignatures.has(sig) || setQid.has(qid)) {
      dupCount++;
      continue;
    }
    setSignatures.add(sig);
    setQid.add(qid);
    const item = Object.assign({ qid, createdAt: Date.now(), track: 'frontend' }, q);
    bank.push(item);
    added.push(item);
  }
  if (added.length) saveBank(bank);
  return { addedCount: added.length, dupCount };
}

function deduplicateBank() {
  const bank = getBank();
  const seenSignatures = new Set();
  const seenQids = new Set();
  const clean = [];
  let removed = 0;

  for (const q of bank) {
    const sig = getQuestionSignature(q);
    const qid = q.qid || hashQid(q.type, q.question);
    if (seenSignatures.has(sig) || seenQids.has(qid)) {
      removed++;
      continue;
    }
    seenSignatures.add(sig);
    seenQids.add(qid);
    clean.push(q);
  }

  if (removed > 0) {
    saveBank(clean);
  }
  return { before: bank.length, after: clean.length, removed };
}

function getFromBank(qid) {
  return getBank().find(b => b.qid === qid) || null;
}

function questionMatchesExclusions(q, exclusions) {
  if (!exclusions || !exclusions.length) return false;
  const content = (q.category + ' ' + q.question + ' ' + (q.options || []).join(' ') + ' ' + (q.explanation || '')).toLowerCase();
  for (const ex of exclusions) {
    const term = String(ex).trim().toLowerCase();
    if (term && content.includes(term)) return true;
  }
  return false;
}

// 采用「防疲劳发牌箱 (Deck Shuffling) 与曝光冷却」机制，优先抽选近期未出过的冷题目
function sampleFromBank(n, exclusions) {
  const allBank = getBank();
  if (allBank.length === 0) return [];
  let bank = allBank;
  if (exclusions && exclusions.length > 0) {
    bank = allBank.filter(q => !questionMatchesExclusions(q, exclusions));
  }
  if (bank.length === 0) return [];

  // 1. 获取最近 5 轮历史作答中的题目曝光权重
  const rounds = getRounds();
  const recentRounds = rounds.slice(-5);
  const exposureMap = new Map();
  recentRounds.forEach((r, roundIdx) => {
    const weight = roundIdx + 1; // 越近的轮次权重越大
    (r.questions || []).forEach(q => {
      const qid = q.qid || hashQid(q.type, q.question);
      exposureMap.set(qid, (exposureMap.get(qid) || 0) + weight);
    });
  });

  // 2. 按题型分组
  const byType = { single: [], multiple: [], boolean: [] };
  for (const q of bank) {
    if (byType[q.type]) byType[q.type].push(q);
  }

  const want = {
    single: Math.min(40, byType.single.length),
    multiple: Math.min(10, byType.multiple.length),
    boolean: Math.min(10, byType.boolean.length)
  };

  // 冷却优先抽样算法：低曝光（甚至 0 曝光）排在最前，同等曝光度内随机打乱
  function pickCoolQuestions(pool, count) {
    if (pool.length <= count) return shuffle(pool);
    const sorted = pool.slice().sort((a, b) => {
      const qidA = a.qid || hashQid(a.type, a.question);
      const qidB = b.qid || hashQid(b.type, b.question);
      const expA = exposureMap.get(qidA) || 0;
      const expB = exposureMap.get(qidB) || 0;
      if (expA !== expB) return expA - expB;
      return Math.random() - 0.5;
    });
    return sorted.slice(0, count);
  }

  let picks = [];
  for (const t of ['single', 'multiple', 'boolean']) {
    picks = picks.concat(pickCoolQuestions(byType[t], want[t]));
  }
  let remain = n - picks.length;
  if (remain > 0) {
    const pool = bank.filter(q => !picks.includes(q));
    picks = picks.concat(pickCoolQuestions(pool, remain));
  }

  return sortQuestionsByType(picks).map(q => ({
    type: q.type,
    category: q.category,
    question: q.question,
    options: q.options.slice(),
    answer: Array.isArray(q.answer) ? q.answer.slice() : q.answer,
    explanation: q.explanation,
    qid: q.qid || hashQid(q.type, q.question),
    createdAt: q.createdAt
  }));
}

const TYPE_ORDER = { single: 1, multiple: 2, boolean: 3 };

function sortQuestionsByType(questions) {
  if (!Array.isArray(questions)) return [];
  return questions.slice().sort((a, b) => {
    const oa = TYPE_ORDER[a.type] || 99;
    const ob = TYPE_ORDER[b.type] || 99;
    return oa - ob;
  });
}

function toIndex(a) {
  if (typeof a === 'number') return a;
  if (typeof a === 'string') {
    const s = a.trim();
    if (/^[0-9]+$/.test(s)) return parseInt(s, 10);
    const m = s.match(/[A-Za-z]/);
    if (m) return m[0].toUpperCase().charCodeAt(0) - 65;
  }
  return -1;
}

function normalizeQuestion(r) {
  const type = (r && r.type || '').toLowerCase();
  if (['single', 'multiple', 'boolean'].indexOf(type) < 0) return null;
  let options = Array.isArray(r.options) ? r.options.map(String) : [];
  if (type === 'boolean') options = ['正确', '错误'];
  if (options.length < 2) return null;
  let answer;
  if (type === 'multiple') {
    let arr = Array.isArray(r.answer) ? r.answer : [r.answer];
    answer = arr.map(toIndex).filter(i => i >= 0 && i < options.length);
    if (answer.length < 1) return null;
    answer = Array.from(new Set(answer)).sort((a, b) => a - b);
  } else {
    answer = toIndex(r.answer);
    if (answer < 0 || answer >= options.length) return null;
  }
  const category = normalizeCategoryName(r.category || 'JavaScript');
  const question = String(r.question || '').trim();
  if (!question) return null;
  const explanation = String(r.explanation || '（暂无解析）').trim();
  return { type, category, question, options, answer, explanation };
}

function parseAIQuestions(text) {
  let raw = text.trim();
  raw = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
  let arr;
  try { arr = JSON.parse(raw); }
  catch(e) {
    const s = raw.indexOf('['), eIdx = raw.lastIndexOf(']');
    if (s >= 0 && eIdx > s) {
      try { arr = JSON.parse(raw.slice(s, eIdx + 1)); } catch(e2) { arr = null; }
    }
  }
  if (!Array.isArray(arr)) throw new Error('AI 返回内容无法解析为合法 JSON 数组');
  const out = [];
  for (const item of arr) {
    const q = normalizeQuestion(item);
    if (q) out.push(q);
  }
  if (out.length === 0) throw new Error('AI 返回的题目未通过合规校验');
  return out;
}

async function callAI(messages, settingsOverride) {
  const s = Object.assign({}, getSettings(), settingsOverride || {});
  if (USE_SERVER) {
    const resp = await fetch('/api/ai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, settings: s })
    });
    if (!resp.ok) {
      let detail = '';
      try { const j = await resp.json(); detail = j.error || JSON.stringify(j); }
      catch(e) { try { detail = await resp.text(); } catch(e2) {} }
      throw new Error(detail || ('HTTP ' + resp.status));
    }
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    return data.content || '';
  }

  const provider = normalizeProvider(s.provider);
  const preset = PROVIDER_PRESETS[provider];
  const chatUrl = provider === 'custom' ? s.baseUrl : preset.chatUrl;
  const key = ((s.apiKeys || {})[provider] || s.apiKey || '').trim();
  const model = s.model || preset.model;
  const resp = await fetch(chatUrl, {
    method: 'POST',
    headers: Object.assign({ 'Content-Type': 'application/json' }, key ? { 'Authorization': 'Bearer ' + key } : {}),
    body: JSON.stringify({ model, messages, temperature: 0.7, stream: false })
  });
  const text = await resp.text();
  const data = JSON.parse(text);
  const msg = data.choices && data.choices[0] && data.choices[0].message;
  return (msg && msg.content) || '';
}

async function generateAIQuestionsWithExclusions(exclusions, progressCb) {
  const sys = {
    role: 'system',
    content: '你是专业的前端面试出题官，只出客观基础题，输出纯 JSON 数组。'
  };
  let qs = [];
  let lastErr = '';

  // 从已有题库抽取多达 25 道题做负样本防重避让
  const existingBank = getBank();
  const negativeSamples = shuffle(existingBank).slice(0, 25).map(q => q.question);

  // 跨批次及批次内题目指纹去重缓存（包含已有题库的多维指纹）
  const seenSignatures = new Set(existingBank.map(q => getQuestionSignature(q)));
  const seenQids = new Set(existingBank.map(q => q.qid || hashQid(q.type, q.question)));

  const parts = [
    { id: 'single1', label: '第 1 批：JavaScript 深度核心与异步 (20 题)' },
    { id: 'single2', label: '第 2 批：现代框架原理与 CSS/工程化 (20 题)' },
    { id: 'many',    label: '第 3 批：网络安全、性能指标与综合题 (20 题)' }
  ];

  for (let i = 0; i < parts.length; i++) {
    const part = parts[i];
    if (progressCb) progressCb(i + 1, parts.length, part.label);

    const prompt = buildPrompt(part.id, exclusions, negativeSamples);
    let partSuccess = false;

    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const text = await callAI([sys, { role: 'user', content: prompt }]);
        const got = parseAIQuestions(text);
        for (const q of got) {
          if (questionMatchesExclusions(q, exclusions)) continue;
          const sig = getQuestionSignature(q);
          const qid = hashQid(q.type, q.question);
          if (seenSignatures.has(sig) || seenQids.has(qid)) continue; // 高精度多维指纹去重
          seenSignatures.add(sig);
          seenQids.add(qid);
          qs.push(q);
        }
        partSuccess = true;
        break;
      } catch(e) {
        lastErr = e.message;
      }
    }

    if (!partSuccess && qs.length === 0) {
      throw new Error(lastErr || 'AI 生成超时或网络异常');
    }
  }

  return { questions: qs, aiCount: qs.length, error: lastErr };
}

/* ==========================================================================
   8. 判分与错题本
   ========================================================================== */
function pointOf(type) { return type === 'single' ? 1.5 : 2; }
function arraysEqual(a, b) {
  if (!a || !b || a.length !== b.length) return false;
  const x = a.slice().sort(), y = b.slice().sort();
  return x.every((v, i) => v === y[i]);
}
function isCorrect(q, ua) {
  if (ua === null || ua === undefined) return false;
  if (q.type === 'multiple') return arraysEqual(ua, q.answer);
  return ua === q.answer;
}

function computeScore(questions) {
  let score = 0, total = 0, wrong = 0;
  for (const q of questions) {
    const pt = pointOf(q.type);
    total += pt;
    if (isCorrect(q, q.userAnswer)) score += pt;
    else wrong++;
  }
  return {
    score: Math.round(score * 10) / 10,
    total: Math.round(total * 10) / 10,
    wrong,
    correct: questions.length - wrong
  };
}

function updateWrongNormal(questions) {
  const w = getWrong();
  for (const q of questions) {
    if (isCorrect(q, q.userAnswer)) continue;
    const e = w[q.qid] || { qid: q.qid, wrongCount: 0, lastWrong: 0, correctStreak: 0 };
    e.wrongCount++;
    e.lastWrong = Date.now();
    e.correctStreak = 0;
    w[q.qid] = e;
  }
  save(LS.wrong, w);
}

function updateWrongPractice(questions) {
  const w = getWrong();
  for (const q of questions) {
    const e = w[q.qid];
    if (!e) continue;
    if (isCorrect(q, q.userAnswer)) {
      e.correctStreak = (e.correctStreak || 0) + 1;
      if (e.correctStreak >= 2) delete w[q.qid];
    } else {
      e.wrongCount++;
      e.lastWrong = Date.now();
      e.correctStreak = 0;
    }
  }
  save(LS.wrong, w);
}

function parseHash() {
  const h = (location.hash || '').replace(/^#/, '');
  if (!h) return { view: 'sim', param: null };
  const i = h.indexOf(':');
  if (i < 0) return { view: h, param: null };
  return { view: h.slice(0, i), param: h.slice(i + 1) };
}

function go(view, param) {
  const hash = param ? view + ':' + param : view;
  if ('#' + hash === location.hash) {
    render();
  } else {

  }
}

function onRoute() {
  const r = parseHash();

  state.view = allowed.indexOf(r.view) >= 0 ? r.view : 'sim';
  state.param = r.param;

        state.pendingDeleteId = roundId;
        document.getElementById('confirmModalText').textContent = t('confirmDelMsg', { name: r.name });
        document.getElementById('confirmModal').classList.add('open');
      }
    };
  });

  const prevBtn = document.getElementById('prevPage');
  if (prevBtn) prevBtn.onclick = () => { if (state.simPage > 1) { state.simPage--; renderSim(); } };
  const nextBtn = document.getElementById('nextPage');
  if (nextBtn) nextBtn.onclick = () => { if (state.simPage < totalPages) { state.simPage++; renderSim(); } };
  app.querySelectorAll('.page-num').forEach(p => {
    p.onclick = () => {
      state.simPage = parseInt(p.dataset.page, 10);
      renderSim();
    };
  });
}

function toggleExclusion(term) {
  const s = getSettings();
  let ex = s.exclusions || [];
  const idx = ex.findIndex(x => x.toLowerCase() === term.toLowerCase());
  if (idx >= 0) ex.splice(idx, 1);
  else ex.push(term);
  s.exclusions = ex;
  save(LS.settings, s);
  renderSim();
}

function addExclusion(term) {
  const s = getSettings();
  let ex = s.exclusions || [];
  if (!ex.some(x => x.toLowerCase() === term.toLowerCase())) {
    ex.push(term);
    s.exclusions = ex;
    save(LS.settings, s);
    toast(t('toastExclusionAdded', { name: term }));
    renderSim();
  }
}

function removeExclusion(term) {
  const s = getSettings();
  let ex = s.exclusions || [];
  s.exclusions = ex.filter(x => x.toLowerCase() !== term.toLowerCase());
  save(LS.settings, s);
  renderSim();
}

function generateNewRound() {
  const round = createRound('ai');
  round.source = 'AI 实时出题';
  round.generating = true;
  round.progressText = '正在联系 AI 引擎准备出题…';
  persistRounds();
  renderSim();

  const exclusions = getSettings().exclusions || [];

  (async () => {
    let qs = [], source = 'AI 实时出题', warn = null;
    try {
      const r = await generateAIQuestionsWithExclusions(exclusions, (cur, total, label) => {
        const rounds = getRounds();
        const rIdx = rounds.findIndex(x => x.roundId === round.roundId);
        if (rIdx >= 0) {
          rounds[rIdx].progressText = `AI 出题中 (${cur}/${total})：${label}`;
          persistRounds();
          if (state.view === 'sim') renderSim();
        }
      });
      qs = r.questions;
      if (qs.length === 0) throw new Error(r.error || 'AI 未返回有效题目，请检查网络或更换模型');
      const addRes = addToBank(qs);
      if (addRes.addedCount > 0) {
        toast(`🎉 AI 新题已入库 ${addRes.addedCount} 道（已自动过滤 ${addRes.dupCount} 道重复题目）`);
      } else {
        toast(`本轮题目生成完成（共 ${qs.length} 题，全部为已有题目或已存在于题库）`);
      }
    } catch(e) {
      warn = e.message;
      toast(t('toastAiFallback', { err: e.message }));
      qs = sampleFromBank(60, exclusions);
      if (qs.length === 0) qs = sampleFromBank(60, []);
      if (qs.length > 0) {
        source = t('roundAiFailedTitle');
      } else {
        source = '出题失败';
      }
    }

    qs = sortQuestionsByType(qs).map(q => ({
      type: q.type,
      category: q.category,
      question: q.question,
      options: q.options.slice(),
      answer: Array.isArray(q.answer) ? q.answer.slice() : q.answer,
      explanation: q.explanation,
      qid: q.qid || hashQid(q.type, q.question),
      userAnswer: null
    }));

    const rounds = getRounds();
    const idx = rounds.findIndex(x => x.roundId === round.roundId);
    if (idx >= 0) {
      rounds[idx].questions = qs;
      rounds[idx].source = source;
      rounds[idx].generating = false;
      rounds[idx].warn = warn;
      delete rounds[idx].progressText;
      persistRounds();
    }
    if (state.view === 'sim') renderSim();
    else if (state.view === 'bank') renderBank();
  })();
}

function createBankRound() {
  const exclusions = getSettings().exclusions || [];
  let qs = sampleFromBank(60, exclusions);
  if (qs.length === 0) qs = sampleFromBank(60, []);
  if (qs.length === 0) {
    toast('本地题库暂无题目，请点击「生成新一轮」先让 AI 生成题目！');
    return;
  }
  const qs2 = sortQuestionsByType(qs).map(q => ({
    type: q.type,
    category: q.category,
    question: q.question,
    options: q.options.slice(),
    answer: Array.isArray(q.answer) ? q.answer.slice() : q.answer,
    explanation: q.explanation,
    qid: q.qid || hashQid(q.type, q.question),
    userAnswer: null
  }));
  const round = createRound('bank');
  round.questions = qs2;
  round.source = '本地题库';
  persistRounds();
  go('exam', round.roundId);
}

function startWrongRound() {
  const w = getWrong();
  const ids = Object.keys(w);
  if (ids.length === 0) { toast(t('wrongEmpty')); return; }
  let qs = ids.map(id => getFromBank(id)).filter(Boolean)
    .map(q => ({
      type: q.type,
      category: q.category,
      question: q.question,
      options: q.options.slice(),
      answer: Array.isArray(q.answer) ? q.answer.slice() : q.answer,
      explanation: q.explanation,
      qid: q.qid,
      userAnswer: null
    }));
  if (qs.length > 60) qs = shuffle(qs).slice(0, 60);
  const round = createRound('wrongbook');
  round.questions = qs;
  round.source = '错题本';
  persistRounds();
  go('exam', round.roundId);
}

function openRound(roundId) {
  const round = getRound(roundId);
  if (!round) { toast('练习组不存在'); return; }
  if (round.generating) { toast(t('roundGenerating')); return; }
  if (round.status === 'done') { go('result', roundId); return; }
  go('exam', roundId);
}

/* --- 10.2 模拟考场视图 (Exam) --- */

    app.innerHTML = `
      <div class="loading"><div class="spinner"></div>${t('roundGenerating')}</div>

      sectionBannerHtml = `
        <div class="section-divider t-${q.type}" id="section_${q.type}">

            <div class="section-divider-title">${info.icon} ${info.title}</div>
            <div class="section-divider-desc">${info.desc}</div>
          </div>

    const optsHtml = q.options.map((o, j) => {

        ? (Array.isArray(q.userAnswer) && q.userAnswer.indexOf(j) >= 0)

      return `
        <div class="opt ${isSelected ? 'selected' : ''}" data-q="${i}" data-o="${j}">

    <div class="exam-toolbar">
      <div class="row" style="justify-content:space-between">
        <div>
          <b>${escapeHtml(round.name)}</b>
          <a href="javascript:void(0)" id="exitExam" style="margin-left:12px;font-size:13px;color:var(--brand)">${t('examExit')}</a>
        </div>
        <div class="row">
          <span id="examProgressText" style="font-size:13px;color:var(--text-secondary);font-family:var(--font-mono)">
            ${t('examProgress', { answered: answeredCount, total: totalCount })}
          </span>
          <button class="btn sm" id="submitExamTop">${t('btnSubmitExam')}</button>

      </div>

      ${typeCounts.multiple ? `<button class="section-nav-btn" type="button" onclick="scrollToExamSection('multiple')">📙 ${t('sectionNavMultiple')} (${typeCounts.multiple})</button>` : ''}

      ${t('examShortcuts')}
    </div>

    };
  });

  document.getElementById('submitExamTop').onclick = submitExam;
  document.getElementById('submitExamBottom').onclick = submitExam;

function handleSelectOption(qIdx, oIdx) {
  const round = state.current;
  if (!round) return;
  const q = round.questions[qIdx];
  if (!q) return;

  if (q.type === 'multiple') {
    let cur = Array.isArray(q.userAnswer) ? q.userAnswer.slice() : [];
    const existIdx = cur.indexOf(oIdx);
    if (existIdx >= 0) cur.splice(existIdx, 1);
    else cur.push(oIdx);
    q.userAnswer = cur.sort((a, b) => a - b);
  } else {
    q.userAnswer = oIdx;
  }

  persistRounds();

  const qContainer = document.getElementById('qitem_' + qIdx);
  if (qContainer) {
    qContainer.querySelectorAll('.opt').forEach(el => {
      const thisO = parseInt(el.dataset.o, 10);
      const isSel = q.type === 'multiple'
        ? (Array.isArray(q.userAnswer) && q.userAnswer.indexOf(thisO) >= 0)
        : (q.userAnswer === thisO);
      el.classList.toggle('selected', isSel);
    });
  }

  const answeredCount = round.questions.filter(item => item.userAnswer !== null && (item.type !== 'multiple' || (item.userAnswer && item.userAnswer.length > 0))).length;
  const totalCount = round.questions.length;
  const pct = totalCount > 0 ? Math.round(answeredCount / totalCount * 100) : 0;
  const pText = document.getElementById('examProgressText');
  if (pText) pText.textContent = t('examProgress', { answered: answeredCount, total: totalCount });
  const pBar = document.getElementById('examProgressBar');
  if (pBar) pBar.style.width = pct + '%';
}

function setupExamKeyboardListener() {
  if (window._examKeyHandler) window.removeEventListener('keydown', window._examKeyHandler);
  window._examKeyHandler = (e) => {
    if (state.view !== 'exam' || !state.current) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      submitExam();
    }
  };
  window.addEventListener('keydown', window._examKeyHandler);
}

function submitExam() {
  const round = state.current;
  if (!round) return;
  const sc = computeScore(round.questions);
  round.status = 'done';
  round.score = sc.score;
  round.total = sc.total;
  round.wrong = sc.wrong;
  round.correct = sc.correct;
  persistRounds();

  if (round.kind === 'wrongbook') updateWrongPractice(round.questions);
  else updateWrongNormal(round.questions);

  state.current = null;
  go('result', round.roundId);
}

            <span>正确率: ${typeStats.single.correct} / ${typeStats.single.count} 题</span>
          </div>
        ` : ''}
        ${typeStats.multiple.count ? `
          <div class="type-score-card t-multiple">

            <b>${Math.round(typeStats.multiple.score * 10) / 10} <span style="font-size:13px;color:var(--text-muted)">/ ${typeStats.multiple.total} 分</span></b>

/* --- 10.4 本地题库视图 (Bank) - 统一分类 + 多维度搜索 + “其他”兜底 --- */
function renderBank() {
  const bank = getBank();
  const search = (state.bankSearch || '').trim().toLowerCase();
  const catFilter = state.bankCategoryFilter || 'ALL';

  // 多维度搜索匹配逻辑：包括但不限于题干、类型名字、分类、选项、解析、创建日期等
  let filtered = bank.filter(q => {
    // 类别匹配
    const normCat = normalizeCategoryName(q.category);
    if (catFilter !== 'ALL' && normCat !== catFilter) return false;

    // 手动多维度搜索
    if (!search) return true;
    const typeLabel = q.type === 'single' ? '单选 single' : q.type === 'multiple' ? '多选 multiple' : '判断 boolean';
    const dateStr = fmtTime(q.createdAt);
    const optionsStr = (q.options || []).join(' ');
    const fullSearchText = `${q.question} ${q.category} ${normCat} ${typeLabel} ${optionsStr} ${q.explanation || ''} ${dateStr}`.toLowerCase();
    return fullSearchText.includes(search);
  });

  // 按分类归档分组（包含“其他”兜底）
  const groups = {};
  for (const q of filtered) {
    const c = normalizeCategoryName(q.category);
    (groups[c] = groups[c] || []).push(q);
  }

  // 分类过滤按钮组：和首页按钮完全一致 + “其他”
  const allBankCategories = [...STANDARD_CATEGORIES, '其他'];
  const filterChipsHtml = [
    `<div class="cat-filter-chip ${catFilter === 'ALL' ? 'active' : ''}" data-cat="ALL">${t('allCategory')} (${bank.length})</div>`
  ].concat(allBankCategories.map(c => {
    const count = bank.filter(q => normalizeCategoryName(q.category) === c).length;
    return `<div class="cat-filter-chip ${catFilter === c ? 'active' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)} (${count})</div>`;
  })).join('');

  // 渲染题目分组折叠项
  const sortedGroupKeys = Object.keys(groups).sort((a, b) => {
    if (a === '其他') return 1;
    if (b === '其他') return -1;
    return STANDARD_CATEGORIES.indexOf(a) - STANDARD_CATEGORIES.indexOf(b);
  });

  const secsHtml = sortedGroupKeys.map(cat => {
    const qs = groups[cat];
    const itemsHtml = qs.map(q => {
      const badgeText = q.type === 'single' ? '单选' : q.type === 'multiple' ? '多选' : '判断';
      const ansText = Array.isArray(q.answer) ? q.answer.map(k => String.fromCharCode(65 + k)).join('、') : String.fromCharCode(65 + q.answer);
      const optsHtml = q.options.map((o, j) => {
        const isAns = Array.isArray(q.answer) ? q.answer.indexOf(j) >= 0 : q.answer === j;
        return `
          <div class="opt ${isAns ? 'correct' : ''}">
            <span class="opt-shortcut">${String.fromCharCode(65 + j)}</span>
            <span class="opt-text">${renderRichText(o)}</span>
            ${isAns ? `<b style="color:var(--ok);font-size:12px;margin-left:auto">✓ 正确答案</b>` : ''}
          </div>
        `;
      }).join('');

      return `
        <div class="q">
          <div class="badges">
            <span class="badge t-${q.type}">${badgeText}</span>
            <span class="badge cat">${escapeHtml(q.category)}</span>
            <span class="muted" style="font-size:11px;margin-left:auto">入库时间：${fmtTime(q.createdAt)}</span>
          </div>
          <div class="stem">${renderStem(q.question)}</div>
          ${optsHtml}
          <div class="explain">🎯 答案：${ansText} ｜ ${renderRichText(q.explanation)}</div>
        </div>
      `;
    }).join('');

    return `
      <details class="card" style="margin-bottom:12px">
        <summary>
          <span>${escapeHtml(cat)} <b style="color:var(--brand)">(${qs.length})</b></span>
          <span class="muted" style="font-size:12px">点击展开 / 折叠 ▾</span>
        </summary>
        <div style="margin-top:16px;counter-reset: q 0;">${itemsHtml}</div>
      </details>
    `;
  }).join('');

  app.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0">${t('bankTitle')}</h3>
      <p class="muted">${t('bankDesc', { count: bank.length })}</p>

      <!-- 多维度手动搜索 -->
      <div class="row" style="margin-top:16px;flex-wrap:wrap;gap:8px">
        <input type="text" id="bankSearchInp" placeholder="${t('searchBankPlaceholder')}" value="${escapeHtml(state.bankSearch)}" style="max-width:480px;flex:1" />
        <button class="btn soft" id="bankRound3">🎲 ${t('btnSampleBank')}</button>
        <button class="btn soft" id="btnCleanBank">🧹 ${t('btnCleanBank')}</button>
      </div>

      <!-- 与首页一致的分类过滤栏（增加“其他”） -->
      <div class="category-filter-bar">
        ${filterChipsHtml}
      </div>
    </div>

    <div>${sortedGroupKeys.length > 0 ? secsHtml : `<div class="card muted" style="text-align:center;padding:32px 0;">未检索到匹配题目。可尝试清除搜索词或点击「面试模拟」使用 AI 生成新题！</div>`}</div>
  `;

  document.getElementById('bankRound3').onclick = createBankRound;
  const cleanBtn = document.getElementById('btnCleanBank');
  if (cleanBtn) {
    cleanBtn.onclick = () => {
      const res = deduplicateBank();
      if (res.removed > 0) {
        toast(t('toastBankCleaned', { count: res.removed }));
      } else {
        toast('当前题库非常纯净，未发现任何重复题目！');
      }
      renderBank();
    };
  }

  const sInp = document.getElementById('bankSearchInp');
  sInp.oninput = () => {
    state.bankSearch = sInp.value;
    renderBank();
    const curInp = document.getElementById('bankSearchInp');
    if (curInp) { curInp.focus(); curInp.selectionStart = curInp.selectionEnd = curInp.value.length; }
  };

  app.querySelectorAll('.cat-filter-chip').forEach(chip => {
    chip.onclick = () => {
      state.bankCategoryFilter = chip.dataset.cat;
      renderBank();
    };
  });
}

/* --- 10.5 错题本视图 (Wrong) - 增加每页20道分页 + 题题带答案与详解 --- */
function renderWrong() {
  const w = getWrong();
  const ids = Object.keys(w);
  if (ids.length === 0) {
    app.innerHTML = `
      <div class="card">
        <h3 style="margin-top:0">${t('wrongTitle')}</h3>
        <p class="muted">${t('wrongEmpty')}</p>
        <div class="row" style="margin-top:16px">
          <button class="btn" id="goSimBtn">🚀 ${t('btnGenNew')}</button>
        </div>
      </div>
    `;
    document.getElementById('goSimBtn').onclick = () => go('sim');
    return;
  }

  // 错题本分页：每页 20 道题
  const pageSize = state.wrongPageSize || 20;
  const totalCount = ids.length;
  const totalPages = Math.max(1, Math.ceil(totalCount / pageSize));
  if (state.wrongPage > totalPages) state.wrongPage = totalPages;
  const startIdx = (state.wrongPage - 1) * pageSize;
  const pageIds = ids.slice(startIdx, startIdx + pageSize);

  const itemsHtml = pageIds.map(id => {
    const e = w[id];
    const q = getFromBank(id);
    if (!q) return '';
    const badgeText = q.type === 'single' ? '单选' : q.type === 'multiple' ? '多选' : '判断';
    const ansText = Array.isArray(q.answer) ? q.answer.map(k => String.fromCharCode(65 + k)).join('、') : String.fromCharCode(65 + q.answer);

    const optsHtml = (q.options || []).map((o, j) => {
      const isAns = Array.isArray(q.answer) ? q.answer.indexOf(j) >= 0 : q.answer === j;
      return `
        <div class="opt ${isAns ? 'correct' : ''}">
          <span class="opt-shortcut">${String.fromCharCode(65 + j)}</span>
          <span class="opt-text">${renderRichText(o)}</span>
          ${isAns ? `<b style="color:var(--ok);font-size:12px;margin-left:auto">✓ 正确答案</b>` : ''}
        </div>
      `;
    }).join('');

    return `
      <div class="q">
        <div class="badges">
          <span class="badge t-${q.type}">${badgeText}</span>
          <span class="badge cat">${escapeHtml(q.category)}</span>
          <span class="pill wrongbook">${t('wrongStatsMeta', { count: e.wrongCount, time: fmtTime(e.lastWrong), streak: e.correctStreak || 0 })}</span>
        </div>
        <div class="stem">${renderStem(q.question)}</div>
        ${optsHtml}
        <div class="yourans">
          ${t('labelCorrectAns')}：<span style="font-weight:600;color:var(--ok)">${ansText}</span>
        </div>
        <div class="explain">💡 ${t('labelExplanation')}：${renderRichText(q.explanation)}</div>
      </div>
    `;
  }).join('');

  // 分页控件
  let paginationHtml = '';
  if (totalPages > 1) {
    let pageNumbersHtml = '';
    for (let p = 1; p <= totalPages; p++) {
      pageNumbersHtml += `<button class="page-num ${p === state.wrongPage ? 'active' : ''}" data-wrong-page="${p}">${p}</button>`;
    }
    paginationHtml = `
      <div class="pagination-bar">
        <div>${t('wrongPageInfo', { current: state.wrongPage, total: totalPages, count: totalCount })}</div>
        <div class="page-btns">
          <button class="btn soft sm" id="prevWrongPage" ${state.wrongPage <= 1 ? 'disabled' : ''}>${t('pagePrev')}</button>
          ${pageNumbersHtml}
          <button class="btn soft sm" id="nextWrongPage" ${state.wrongPage >= totalPages ? 'disabled' : ''}>${t('pageNext')}</button>
        </div>
      </div>
    `;
  }

  app.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div>
          <h3 style="margin:0 0 6px 0">${t('wrongTitle')}</h3>
          <p class="muted" style="margin:0">${t('wrongDesc', { count: totalCount })}</p>
        </div>
        <button class="btn" id="startWrongPracticeBtn">${t('btnStartWrongPractice')}</button>
      </div>
    </div>

    <div style="counter-reset: q ${startIdx};">${itemsHtml}</div>
    ${paginationHtml}
  `;

  document.getElementById('startWrongPracticeBtn').onclick = startWrongRound;

  const prevBtn = document.getElementById('prevWrongPage');
  if (prevBtn) prevBtn.onclick = () => { if (state.wrongPage > 1) { state.wrongPage--; renderWrong(); } };
  const nextBtn = document.getElementById('nextWrongPage');
  if (nextBtn) nextBtn.onclick = () => { if (state.wrongPage < totalPages) { state.wrongPage++; renderWrong(); } };
  app.querySelectorAll('[data-wrong-page]').forEach(p => {
    p.onclick = () => {
      state.wrongPage = parseInt(p.dataset.wrongPage, 10);
      renderWrong();
    };
  });
}

/* --- 10.6 设置与 AI 视图 (Settings) - 恢复默认设置提供弹窗提示 --- */
function renderSettings() {
  const s = getSettings();
  const provider = normalizeProvider(s.provider);
  const preset = PROVIDER_PRESETS[provider];
  const isPollinations = provider === 'pollinations';
  const models = preset.models || [];
  const curModel = (s.model || '').trim() || preset.model || '';
  const needKey = !!preset.needKey;
  const isCustomModel = models.length === 0 || models.indexOf(curModel) < 0;
  const savedKey = (s.apiKeys && s.apiKeys[provider]) || s.apiKey || '';

  const providerOpts = Object.keys(PROVIDER_PRESETS).map(k => {
    return `<option value="${k}" ${provider === k ? 'selected' : ''}>${escapeHtml(PROVIDER_PRESETS[k].label)}</option>`;
  }).join('');

  const modelOpts = models.map(m => {
    return `<option value="${m}" ${(!isCustomModel && curModel === m) ? 'selected' : ''}>${escapeHtml(m)}</option>`;
  }).join('') + `<option value="__custom__" ${isCustomModel ? 'selected' : ''}>自定义模型名…</option>`;

  app.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0">${t('settingsTitle')}</h3>
      <p class="muted">EasyOffer 采用纯本地存储架构，不强制提供庞大题库，题目由用户私有 AI 生成并沉淀落盘到本机。</p>

      <label class="fld">${t('setProviderLabel')}</label>
      <select id="setProvider">${providerOpts}</select>
      <div class="hint">${escapeHtml(preset.hint || '')} ${preset.keyUrl ? `<a href="${preset.keyUrl}" target="_blank" rel="noreferrer" style="color:var(--brand)">点击免费获取 API Key ↗</a>` : ''}</div>

      <label class="fld">${t('setModelLabel')}</label>
      <select id="setModel">${modelOpts}</select>
      <input type="text" id="setModelCustom" placeholder="输入模型名称，例如 glm-4-flash" value="${isCustomModel ? escapeHtml(curModel) : ''}" style="margin-top:8px;display:${isCustomModel ? 'block' : 'none'}" />

      <label class="fld">${t('setKeyLabel')}</label>
      <input type="password" id="setKey" placeholder="${needKey ? '在此粘贴你的 API Key' : '该通道无需填 Key'}" value="${needKey ? escapeHtml(savedKey) : ''}" />

      ${provider === 'custom' ? `
        <label class="fld">${t('setBaseUrlLabel')}</label>
        <input type="text" id="setBaseUrl" placeholder="https://api.openai.com/v1/chat/completions" value="${escapeHtml(s.baseUrl || '')}" />
      ` : ''}

      <div class="row" style="margin-top:24px">
        <button class="btn" id="saveSet">💾 ${t('btnSaveSettings')}</button>
        <button class="btn soft" id="testSet">⚡ ${t('btnTestSettings')}</button>
        <button class="btn ghost" id="resetSet">🔄 ${t('btnResetSettings')}</button>
      </div>

      <div class="hint" id="setHint" style="margin-top:12px"></div>
    </div>
  `;

  const $id = id => document.getElementById(id);
  const readForm = () => {
    const p = $id('setProvider').value;
    const cur = getSettings();
    const modelSel = $id('setModel') ? $id('setModel').value : '';
    const model = (modelSel === '__custom__') ? ($id('setModelCustom').value || '').trim() : modelSel;
    const key = $id('setKey') ? ($id('setKey').value || '').trim() : '';
    const baseUrl = $id('setBaseUrl') ? $id('setBaseUrl').value.trim() : (cur.baseUrl || '');
    const apiKeys = Object.assign({}, cur.apiKeys || {});
    if (key) apiKeys[p] = key; else delete apiKeys[p];
    return Object.assign({}, cur, { provider: p, model, baseUrl, apiKeys, apiKey: key });
  };

  $id('setProvider').onchange = () => {
    const f = readForm();
    f.model = '';
    save(LS.settings, f);
    renderSettings();
  };

  if ($id('setModel')) {
    $id('setModel').onchange = () => {
      const isCustom = $id('setModel').value === '__custom__';
      $id('setModelCustom').style.display = isCustom ? 'block' : 'none';
      if (!isCustom) {
        save(LS.settings, readForm());
        renderSettings();
      }
    };
  }

  $id('saveSet').onclick = () => {
    const f = readForm();
    save(LS.settings, f);
    toast(t('toastSettingsSaved'));
    renderSettings();
  };

  // 恢复默认设置给用户明确提示
  $id('resetSet').onclick = () => {
    if (!confirm('确定要恢复默认设置吗？\n当前已保存的服务商与自定义 API Key 将被重置为 EasyOffer 默认的免费大模型通道。')) {
      return;
    }
    const cur = getSettings();
    save(LS.settings, {
      provider: 'pollinations',
      model: 'openai',
      baseUrl: '',
      apiKey: '',
      apiKeys: {},
      exclusions: cur.exclusions || []
    });
    toast('已恢复默认设置（默认免 Key 免费通道）');
    renderSettings();
  };

  const testBtn = $id('testSet');
  if (testBtn) {
    testBtn.onclick = async () => {
      const hint = $id('setHint');
      const f = readForm();
      save(LS.settings, f);
      hint.textContent = '正在发起测试请求，请稍候…';
      try {
        const out = await callAI([{ role: 'user', content: '请只回复两个字：连接成功' }], f);
        hint.innerHTML = `<span style="color:var(--ok)">✅ 测试成功！模型返回：${escapeHtml(out.slice(0, 50))}</span>`;
        toast(t('toastSettingsTestedOk'));
      } catch(e) {
        hint.innerHTML = `<span style="color:var(--bad)">❌ 测试失败：${escapeHtml(e.message)}</span>`;
        toast(t('toastSettingsTestedErr') + e.message);
      }
    };
  }
}

/* ==========================================================================
   11. 侧边栏与模态框绑定
   ========================================================================== */
function setupInteractions() {
  document.getElementById('langSwitch').onclick = toggleLanguage;
  document.getElementById('themeSwitchBtn').onclick = toggleTheme;

  // 悬浮返回顶部按钮交互绑定
  const fab = document.getElementById('fabBackToTop');
  if (fab) {
    fab.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
    window.addEventListener('scroll', () => {
      if (window.scrollY > 240) {
        fab.classList.add('visible');
      } else {
        fab.classList.remove('visible');
      }
    }, { passive: true });
  }

  document.querySelectorAll('.role-item').forEach(el => {
    el.onclick = () => switchRole(el.dataset.role);
  });

  const confirmModal = document.getElementById('confirmModal');
  const closeConfirm = document.getElementById('closeConfirmModal');
  const cancelDel = document.getElementById('cancelDelBtn');
  const doDel = document.getElementById('doDelBtn');

  const closeDelModal = () => confirmModal.classList.remove('open');
  closeConfirm.onclick = closeDelModal;
  cancelDel.onclick = closeDelModal;
  doDel.onclick = () => {
    if (state.pendingDeleteId) {
      deleteRound(state.pendingDeleteId);
      state.pendingDeleteId = null;
    }
    closeDelModal();
  };

  confirmModal.addEventListener('click', (e) => {
    if (e.target === confirmModal) closeDelModal();
  });
}

function cleanWrong() {
  const w = getWrong();
  let changed = false;
  for (const k of Object.keys(w)) {
    if (!k || k === 'undefined' || !getFromBank(k)) {
      delete w[k];
      changed = true;
    }
  }
  if (changed) save(LS.wrong, w);
}

function migrateRounds() {
  const rounds = getRounds();
  let changed = false;
  for (const r of rounds) {
    if (r.kind === undefined) { r.kind = 'ai'; changed = true; }
    if (r.status === undefined) { r.status = r.score != null ? 'done' : 'pending'; changed = true; }
    if (r.createdAt === undefined) { r.createdAt = r.time || Date.now(); changed = true; }
    if (r.generating === undefined) { r.generating = false; changed = true; }
    if (r.source === undefined) { r.source = ''; changed = true; }
  }
  if (changed) persistRounds();
}

async function init() {
  document.querySelectorAll('#nav button').forEach(b => {
    b.onclick = () => {
      selectedRoleId = 'frontend';
      go(b.dataset.view);
    };
  });
  document.getElementById('brandLogo').onclick = () => {
    selectedRoleId = 'frontend';
    go('sim');
  };

  applyTheme(currentTheme);
  setupInteractions();
  await bootstrap();
  migrateRounds();
  cleanWrong();
  updateI18nStaticText();

  await doSync();
  onRoute();
}

init().catch(e => {
  console.error('EasyOffer Init Error:', e);
  if (app) {
    app.innerHTML = `
      <div class="card" style="border-color:var(--bad)">
        <h3 style="color:var(--bad)">⚠️ 初始化失败</h3>
        <pre style="white-space:pre-wrap;font-size:13px">${escapeHtml(e.message || e)}</pre>
      </div>
    `;
  }
});
</script>
